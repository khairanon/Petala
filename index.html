<script>/* js/views/tasks.js */
'use strict';
/* ============================================================
   Tarefas (to-do): listas, prioridades, prazos e progresso
   ============================================================ */
const PRIO = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };
const PRIO_W = { alta: 0, media: 1, baixa: 2 };

function taskDueLabel(t) {
  if (!t.due) return '';
  const late = !t.done && t.due < D.today();
  return `<span class="${late ? 'late' : ''}">${ic('clock')} ${late ? 'Atrasada · ' + D.short(t.due) : D.rel(t.due)}</span>`;
}
/* ---------- Repetição (tarefas recorrentes) ---------- */
const REPEAT_PRESETS = [['', 'Não repete'], ['1d', 'Todo dia'], ['2d', 'A cada 2 dias'], ['3d', 'A cada 3 dias'], ['1w', 'Toda semana'], ['2w', 'A cada 2 semanas'], ['1m', 'Todo mês'], ['custom', 'Personalizado…']];
const UNIT_NAMES = { day: ['dia', 'dias'], week: ['semana', 'semanas'], month: ['mês', 'meses'] };
function repeatLabel(r) {
  if (!r) return '';
  if (r.every === 1) return r.unit === 'day' ? 'Todo dia' : r.unit === 'week' ? 'Toda semana' : 'Todo mês';
  return `A cada ${r.every} ${UNIT_NAMES[r.unit][1]}`;
}
const repeatCode = r => r ? `${r.every}${r.unit[0]}` : '';
const parseRepeatCode = c => { const m = /^(\d+)([dwm])$/.exec(c || ''); return m ? { every: +m[1], unit: { d: 'day', w: 'week', m: 'month' }[m[2]] } : null; };
function addRepeat(k, r) {
  if (r.unit === 'day') return D.add(k, r.every);
  if (r.unit === 'week') return D.add(k, 7 * r.every);
  return D.dayOf(D.addMonths(D.month(k), r.every), +k.slice(8));
}
/* próximas ocorrências previstas (só para exibir no calendário) */
function projectedTasks(d) {
  if (d <= D.today()) return [];
  return S.tasks.filter(t => !t.done && t.repeat && t.due && t.due < d).filter(t => {
    let k = t.due, g = 0;
    while (k < d && g++ < 400) k = addRepeat(k, t.repeat);
    return k === d;
  });
}
function createNextOccurrence(t, base) {
  const next = { ...t, id: uid(), done: false, doneAt: null, createdAt: D.today(), nextId: null, series: t.series || t.id, due: addRepeat(base, t.repeat) };
  S.tasks.push(next);
  return next;
}

function taskItem(t, o = {}) {
  const c = catById(t.cat), l = listById(t.list);
  return `<div class="item ${t.done ? 'done' : ''}" data-task="${t.id}">
    <button class="check prio-${t.priority} ${t.done ? 'on' : ''}" data-act="toggleTask" data-id="${t.id}" aria-label="Concluir">${ic('check')}</button>
    <div class="body" data-act="editTask" data-id="${t.id}">
      <div class="title">${esc(t.title)}</div>
      <div class="meta">${taskDueLabel(t)}${catChip(c, true)}${t.priority === 'alta' ? `<span class="pill bad" style="height:20px;font-size:11px">${ic('flag')}Alta</span>` : ''}${!o.hideList && l && UI.taskList === 'all' ? `<span>${esc(l.name)}</span>` : ''}${t.goal ? `<span>${ic('target')}</span>` : ''}${t.repeat ? `<span class="rep">${ic('repeat')} ${repeatLabel(t.repeat)}</span>` : ''}</div>
    </div>
  </div>`;
}
const sortTasks = (arr, by = UI.taskSort) => arr.slice().sort((a, b) => by === 'prio'
  ? (PRIO_W[a.priority] - PRIO_W[b.priority]) || ((a.due || '9') < (b.due || '9') ? -1 : 1)
  : ((a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : PRIO_W[a.priority] - PRIO_W[b.priority]));
const pendingTasks = () => S.tasks.filter(t => !t.done);
function homeTasks(n = 5) { // atrasadas primeiro, depois hoje, depois prioridade
  const t = D.today();
  return pendingTasks().sort((a, b) => {
    const sa = a.due && a.due <= t ? 0 : 1, sb = b.due && b.due <= t ? 0 : 1;
    return sa - sb || PRIO_W[a.priority] - PRIO_W[b.priority] || (a.due || '9') .localeCompare(b.due || '9');
  }).slice(0, n);
}

function toggleTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  t.done = !t.done;
  if (t.done) {
    t.doneAt = D.today();
    award('task:' + t.id, XP.task[t.priority] || 10, 'Tarefa: ' + t.title);
    burst(); haptic();
    if (t.repeat && !t.nextId) {
      const next = createNextOccurrence(t, D.today()); // conta a partir de quando você fez
      t.nextId = next.id;
      toast(`Feito! Próxima vez: ${D.rel(next.due).toLowerCase()} (${D.short(next.due)})`, 'repeat');
    } else if (Math.random() < .55) toast(pick(ENCOURAGE), 'heart');
  } else {
    t.doneAt = null; revoke('task:' + t.id);
    const next = t.nextId && S.tasks.find(x => x.id === t.nextId);
    if (next && !next.done) S.tasks = S.tasks.filter(x => x.id !== next.id);
    t.nextId = null;
  }
  refresh();
}
ACT.toggleTask = el => toggleTask(el.dataset.id);

VIEWS.tasks = () => {
  const list = UI.taskList;
  const inList = S.tasks.filter(t => list === 'all' || t.list === list);
  const done = inList.filter(t => t.done).length, total = inList.length;
  const today = D.today(), doneToday = S.tasks.filter(t => t.done && t.doneAt === today).length;
  let shown = inList.filter(t => UI.taskFilter === 'all' ? true : UI.taskFilter === 'done' ? t.done : !t.done);
  const curList = listById(list);

  let body = '';
  if (!shown.length) {
    body = empty('tasks', UI.taskFilter === 'done' ? 'Nada concluído ainda' : 'Tudo em dia!', UI.taskFilter === 'done' ? 'As tarefas concluídas aparecem aqui.' : 'Crie uma tarefa e comece a riscar da lista.', `<button class="btn soft sm" data-act="newTask">${ic('plus')}Nova tarefa</button>`);
  } else if (UI.taskFilter === 'done') {
    body = shown.sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || '')).map(t => taskItem(t)).join('');
  } else {
    const groups = [['Atrasadas', t => !t.done && t.due && t.due < today], ['Hoje', t => t.due === today], ['Próximos dias', t => t.due && t.due > today], ['Sem prazo', t => !t.due], ['Concluídas', t => t.done && t.due && t.due < today]];
    const used = new Set();
    body = groups.map(([name, f]) => {
      const g = sortTasks(shown.filter(t => !used.has(t.id) && f(t))); g.forEach(t => used.add(t.id));
      return g.length ? `<div class="group-label">${name} <span>${g.length}</span></div>${g.map(t => taskItem(t)).join('')}` : '';
    }).join('');
  }
  return `${pageHead('Tarefas', { sub: `${plural(pendingTasks().length, 'pendente')}` })}
  <div class="card progress-card">
    <div class="row between"><div><p class="eyebrow">${curList ? esc(curList.name) : 'Todas as listas'}</p><b class="big-num">${done}<small>/${total}</small></b> <span class="muted small">concluídas</span></div>
    ${ring(pct(done, total), 62, 7, `${Math.round(pct(done, total) * 100)}%`)}</div>
    ${progressBar(pct(done, total), '', 'fat')}
    <p class="small muted" style="margin-top:8px">${doneToday ? `${ic('sparkle')} ${plural(doneToday, 'tarefa concluída', 'tarefas concluídas')} hoje` : 'Nenhuma tarefa concluída hoje ainda, você consegue!'}</p>
  </div>
  <div class="scroll-x" style="margin-top:16px">
    <button class="fchip ${list === 'all' ? 'on' : ''}" data-act="setTaskList" data-id="all">Todas</button>
    ${S.lists.map(l => `<button class="fchip ${list === l.id ? 'on' : ''}" style="--c:${l.color}" data-act="setTaskList" data-id="${l.id}"><span class="dot"></span>${esc(l.name)} <span class="muted">${S.tasks.filter(t => t.list === l.id && !t.done).length}</span></button>`).join('')}
    <button class="fchip" data-act="newList">${ic('plus')}Nova lista</button>
  </div>
  <div class="row" style="margin:6px 0 4px">
    <div class="seg btns" style="flex:1">${[['pending', 'Pendentes'], ['done', 'Concluídas'], ['all', 'Todas']].map(([v, l]) => `<button class="${UI.taskFilter === v ? 'on' : ''}" data-act="setTaskFilter" data-v="${v}">${l}</button>`).join('')}</div>
    <button class="icon-btn" data-act="toggleTaskSort" aria-label="Ordenar" title="Ordenar">${ic(UI.taskSort === 'prio' ? 'flag' : 'clock')}</button>
    ${curList ? `<button class="icon-btn" data-act="editList" data-id="${curList.id}" aria-label="Editar lista">${ic('edit')}</button>` : ''}
  </div>
  <p class="hint" style="margin:2px 4px 8px">Ordenado por ${UI.taskSort === 'prio' ? 'prioridade' : 'prazo'}</p>
  <div class="card list">${body}</div>`;
};
ACT.setTaskList = el => { UI.taskList = el.dataset.id; render(); };
ACT.setTaskFilter = el => { UI.taskFilter = el.dataset.v; render(); };
ACT.toggleTaskSort = () => { UI.taskSort = UI.taskSort === 'prio' ? 'due' : 'prio'; render(); };

/* ---------- Formulário de tarefa ---------- */
function taskForm(t = {}) {
  const isNew = !t.id;
  const goals = S.goals.filter(g => !g.done || g.id === t.goal);
  openSheet({
    title: isNew ? 'Nova tarefa' : 'Editar tarefa',
    html: `<form class="form">
      ${field('O que precisa ser feito?', `<input name="title" required maxlength="140" placeholder="Ex.: Estudar bioquímica" value="${esc(t.title || '')}" ${isNew ? 'autofocus' : ''}>`)}
      ${fieldset('Lista', chipsRadio('list', S.lists.map(l => ({ value: l.id, label: l.name, color: l.color })), t.list || (UI.taskList !== 'all' ? UI.taskList : S.lists[0]?.id)))}
      ${fieldset('Prioridade', segmented('priority', [{ value: 'baixa', label: 'Baixa' }, { value: 'media', label: 'Média' }, { value: 'alta', label: 'Alta' }], t.priority || 'media'))}
      <div class="inline-fields">${field('Prazo', `<input type="date" name="due" value="${t.due || ''}">`)}
      ${field('Meta vinculada', `<select name="goal"><option value="">Nenhuma</option>${goals.map(g => `<option value="${g.id}" ${g.id === t.goal ? 'selected' : ''}>${esc(g.title)}</option>`).join('')}</select>`)}</div>
      ${field('Repetir', `<select name="repeat">${REPEAT_PRESETS.map(([v, l]) => `<option value="${v}" ${(REPEAT_PRESETS.some(p => p[0] === repeatCode(t.repeat)) ? repeatCode(t.repeat) : (t.repeat ? 'custom' : '')) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}
      <div class="inline-fields rep-custom" ${t.repeat && !REPEAT_PRESETS.some(p => p[0] === repeatCode(t.repeat)) ? '' : 'hidden'}>
        ${field('A cada', `<input type="number" name="repEvery" min="1" max="365" value="${t.repeat ? t.repeat.every : 2}">`)}
        ${field('Unidade', `<select name="repUnit">${Object.entries(UNIT_NAMES).map(([u, n]) => `<option value="${u}" ${(t.repeat ? t.repeat.unit : 'day') === u ? 'selected' : ''}>${n[1]}</option>`).join('')}</select>`)}
      </div>
      <p class="hint rep-hint" ${t.repeat ? '' : 'hidden'}>Ao concluir, a próxima é criada automaticamente, contando a partir do dia em que você fez.</p>
      ${fieldset('Categoria', chipsRadio('cat', catOptions(), t.cat || 'c_out', 'scroll'))}
      ${field('Observações', `<textarea name="notes" rows="2" placeholder="Opcional">${esc(t.notes || '')}</textarea>`)}
      <div class="btn-row">${!isNew ? `<button type="button" class="btn danger" data-act="delTask" data-id="${t.id}">${ic('trash')}</button>` : ''}<button class="btn primary">${isNew ? 'Adicionar' : 'Salvar'}</button></div>
      ${!isNew && t.repeat && !t.done ? `<button type="button" class="btn ghost block" data-act="skipTask" data-id="${t.id}">${ic('repeat')} Pular desta vez</button>` : ''}
    </form>`,
    onMount: sh => {
      const sel = sh.querySelector('[name=repeat]');
      sel.addEventListener('change', () => {
        sh.querySelector('.rep-custom').hidden = sel.value !== 'custom';
        sh.querySelector('.rep-hint').hidden = !sel.value;
        const due = sh.querySelector('[name=due]');
        if (sel.value && !due.value) due.value = D.today();
      });
    },
    onSubmit: fd => {
      const rc = fd.get('repeat');
      const repeat = rc === 'custom' ? { every: clamp(+fd.get('repEvery') || 1, 1, 365), unit: fd.get('repUnit') } : parseRepeatCode(rc);
      const data = { title: fd.get('title').trim(), list: fd.get('list'), priority: fd.get('priority'), due: fd.get('due') || (repeat ? D.today() : null), cat: fd.get('cat'), notes: fd.get('notes').trim(), goal: fd.get('goal') || null, repeat };
      if (!data.title) return false;
      if (isNew) { S.tasks.push({ id: uid(), createdAt: D.today(), done: false, doneAt: null, ...data }); toast('Tarefa criada', 'check'); }
      else {
        const cur = S.tasks.find(x => x.id === t.id);
        if (cur.done && cur.priority !== data.priority) { revoke('task:' + cur.id); award('task:' + cur.id, XP.task[data.priority], 'Tarefa: ' + data.title, { silent: true }); }
        Object.assign(cur, data);
      }
      refresh();
    }
  });
}
ACT.newTask = () => taskForm({ due: UI.route === 'agenda' ? UI.agendaDate : null });
ACT.editTask = el => taskForm(S.tasks.find(t => t.id === el.dataset.id));
ACT.delTask = async el => {
  const t0 = S.tasks.find(t => t.id === el.dataset.id);
  const msg = t0 && t0.repeat && !t0.done ? `Ela repete (${repeatLabel(t0.repeat).toLowerCase()}). Ao excluir, a repetição para. Se quiser só pular hoje, use "Pular desta vez".` : 'Esta tarefa será excluída.';
  if (!await ask(msg, { ok: 'Excluir', danger: true, title: 'Excluir tarefa?' })) return;
  revoke('task:' + el.dataset.id);
  S.tasks = S.tasks.filter(t => t.id !== el.dataset.id);
  closeSheet(); refresh(); toast('Tarefa excluída', 'trash');
};

ACT.skipTask = el => {
  const t = S.tasks.find(x => x.id === el.dataset.id); if (!t || !t.repeat) return;
  const next = createNextOccurrence(t, t.due || D.today()); // mantém o ritmo pelo prazo
  S.tasks = S.tasks.filter(x => x.id !== t.id);
  closeSheet(); refresh(); toast(`Pulada. Próxima: ${D.short(next.due)}`, 'repeat');
};

/* ---------- Listas ---------- */
function listForm(l = {}) {
  const isNew = !l.id;
  openSheet({
    title: isNew ? 'Nova lista' : 'Editar lista',
    html: `<form class="form">
      ${field('Nome da lista', `<input name="name" required maxlength="40" value="${esc(l.name || '')}" placeholder="Ex.: Mercado, Docico, Provas">`)}
      ${fieldset('Cor', colorPicker('color', l.color))}
      <div class="btn-row">${!isNew && S.lists.length > 1 ? `<button type="button" class="btn danger" data-act="delList" data-id="${l.id}">${ic('trash')}</button>` : ''}<button class="btn primary">Salvar</button></div>
    </form>`,
    onSubmit: fd => {
      const data = { name: fd.get('name').trim(), color: fd.get('color') };
      if (isNew) { const id = 'l_' + uid(); S.lists.push({ id, ...data }); UI.taskList = id; }
      else Object.assign(S.lists.find(x => x.id === l.id), data);
      refresh();
    }
  });
}
ACT.newList = () => listForm();
ACT.editList = el => listForm(listById(el.dataset.id));
ACT.delList = async el => {
  const id = el.dataset.id, l = listById(id);
  const others = S.lists.filter(x => x.id !== id);
  const n = S.tasks.filter(t => t.list === id).length;
  if (!await ask(n ? `As ${n} tarefas desta lista serão movidas para "${esc(others[0].name)}".` : 'A lista será excluída.', { ok: 'Excluir', danger: true, title: `Excluir "${esc(l.name)}"?` })) return;
  S.tasks.forEach(t => { if (t.list === id) t.list = others[0].id; });
  S.lists = others; UI.taskList = 'all';
  closeSheet(); refresh();
};

</script>
<script>/* js/views/agenda.js */
'use strict';
/* ============================================================
   Agenda e calendário: visões diária, semanal e mensal
   ============================================================ */
const eventsOn = d => S.events.filter(e => e.date === d).sort((a, b) => (a.allDay ? -1 : 0) - (b.allDay ? -1 : 0) || (a.start || '').localeCompare(b.start || ''));
const tasksDueOn = d => S.tasks.filter(t => t.due === d);

function eventItem(e, o = {}) {
  const c = catById(e.cat);
  return `<div class="item ${e.done ? 'done' : ''}">
    <div class="timebox">${e.allDay || !e.start ? '<small>dia</small>todo' : `${e.start}${e.end ? `<small>${e.end}</small>` : ''}`}</div>
    <span class="colorbar" style="--c:${c.color}"></span>
    <div class="body" data-act="editEvent" data-id="${e.id}">
      <div class="title">${esc(e.title)}</div>
      <div class="meta">${o.showDate ? `<span>${ic('calendar')} ${D.rel(e.date)}</span>` : ''}${catChip(c, true)}${e.desc ? `<span>${esc(e.desc.slice(0, 40))}${e.desc.length > 40 ? '…' : ''}</span>` : ''}</div>
    </div>
    <button class="check sq ${e.done ? 'on' : ''}" style="--c:${c.color}" data-act="toggleEvent" data-id="${e.id}" aria-label="Concluir">${ic('check')}</button>
  </div>`;
}
function dayItems(d, o = {}) {
  const ev = eventsOn(d), tk = tasksDueOn(d), pj = projectedTasks(d);
  const pjHtml = pj.map(t => `<div class="item projected" data-act="editTask" data-id="${t.id}"><span class="check" style="--c:#D9CCE8;opacity:.6"></span><div class="body"><div class="title">${esc(t.title)}</div><div class="meta"><span class="rep">${ic('repeat')} previsto · ${repeatLabel(t.repeat).toLowerCase()}</span></div></div></div>`).join('');
  if (!ev.length && !tk.length && pj.length) return pjHtml;
  if (!ev.length && !tk.length) return o.emptyHtml ?? `<p class="free-day">${ic('leaf')} Dia livre: nada agendado</p>`;
  return ev.map(e => eventItem(e)).join('') + (tk.length ? `${ev.length ? '<div class="group-label">Tarefas com prazo</div>' : ''}${tk.map(t => taskItem(t)).join('')}` : '') + pjHtml;
}
function dayDots(d) {
  const cols = [...new Set(eventsOn(d).map(e => catById(e.cat).color))].slice(0, 3);
  const hasTask = S.tasks.some(t => t.due === d && !t.done) || projectedTasks(d).length > 0;
  return `<span class="dots">${cols.map(c => `<i style="background:${c}"></i>`).join('')}${hasTask ? '<i class="tdot"></i>' : ''}</span>`;
}
function toggleEvent(id) {
  const e = S.events.find(x => x.id === id); if (!e) return;
  e.done = !e.done;
  if (e.done) { e.doneAt = D.today(); award('event:' + e.id, XP.event, 'Compromisso: ' + e.title); burst(); haptic(); }
  else { e.doneAt = null; revoke('event:' + e.id); }
  refresh();
}
ACT.toggleEvent = el => toggleEvent(el.dataset.id);

/* ---------- Calendário mensal ---------- */
function monthGrid(mk, sel, compact = false) {
  const first = D.dayOf(mk, 1), lead = D.weekday(first), n = D.daysInMonth(mk);
  const cells = Math.ceil((lead + n) / 7) * 7, t = D.today();
  let html = `<div class="cal-grid ${compact ? 'compact' : ''}">${WD1.map(w => `<span class="cal-wd">${w}</span>`).join('')}`;
  for (let i = 0; i < cells; i++) {
    const d = D.add(first, i - lead), other = D.month(d) !== mk;
    html += `<button class="cal-day ${other ? 'other' : ''} ${d === t ? 'today' : ''} ${d === sel ? 'sel' : ''}" data-act="pickDay" data-d="${d}"><span class="n">${+d.slice(8)}</span>${dayDots(d)}</button>`;
  }
  return html + '</div>';
}

VIEWS.agenda = () => {
  if (!UI.agendaDate) UI.agendaDate = D.today();
  const sel = UI.agendaDate, mode = UI.agendaMode, t = D.today();
  let nav = '', main = '';
  if (mode === 'month') {
    const mk = D.month(sel);
    nav = `<button class="icon-btn sm" data-act="agendaNav" data-n="-1">${ic('chevL')}</button><b>${D.monthLabel(mk)}</b><button class="icon-btn sm" data-act="agendaNav" data-n="1">${ic('chevR')}</button>`;
    main = `<div class="card cal-card">${monthGrid(mk, sel)}</div>
      <div class="section-title"><h2>${D.rel(sel) === 'Hoje' ? 'Hoje' : D.long(sel)}</h2><button class="link" data-act="newEvent">${ic('plus')} Adicionar</button></div>
      <div class="card list">${dayItems(sel)}</div>`;
  } else if (mode === 'week') {
    const ws = D.weekStart(sel), we = D.add(ws, 6);
    nav = `<button class="icon-btn sm" data-act="agendaNav" data-n="-1">${ic('chevL')}</button><b>${D.short(ws)} – ${D.short(we)}</b><button class="icon-btn sm" data-act="agendaNav" data-n="1">${ic('chevR')}</button>`;
    main = `<div class="week-strip card">${D.range(ws, we).map(d => `<button class="wk-day ${d === t ? 'today' : ''} ${d === sel ? 'sel' : ''}" data-act="pickDay" data-d="${d}"><small>${WD[D.weekday(d)]}</small><b>${+d.slice(8)}</b>${dayDots(d)}</button>`).join('')}</div>
      ${D.range(ws, we).map(d => `<div class="week-block ${d === sel ? 'sel' : ''}"><div class="wb-head"><b>${WD[D.weekday(d)]}, ${D.short(d)}</b>${d === t ? '<span class="pill">Hoje</span>' : ''}<button class="icon-btn sm soft" data-act="newEventOn" data-d="${d}" aria-label="Adicionar">${ic('plus')}</button></div>
      <div class="card list flat">${dayItems(d, { emptyHtml: `<p class="free-day">${ic('leaf')} Livre</p>` })}</div></div>`).join('')}`;
  } else {
    nav = `<button class="icon-btn sm" data-act="agendaNav" data-n="-1">${ic('chevL')}</button><b>${D.rel(sel) === 'Hoje' ? 'Hoje, ' + D.short(sel) : WD[D.weekday(sel)] + ', ' + D.short(sel)}</b><button class="icon-btn sm" data-act="agendaNav" data-n="1">${ic('chevR')}</button>`;
    const ev = eventsOn(sel), allDay = ev.filter(e => e.allDay || !e.start), timed = ev.filter(e => !e.allDay && e.start);
    const h0 = Math.min(7, ...timed.map(e => +e.start.slice(0, 2))), h1 = Math.max(22, ...timed.map(e => +e.start.slice(0, 2)));
    const nowH = sel === t ? new Date().getHours() : -1;
    let tl = '';
    for (let h = h0; h <= h1; h++) {
      const hs = timed.filter(e => +e.start.slice(0, 2) === h);
      tl += `<div class="tl-row ${h === nowH ? 'now' : ''}"><span class="tl-h">${pad(h)}:00</span><div class="tl-slot" ${hs.length ? '' : `data-act="newEventAt" data-d="${sel}" data-t="${pad(h)}:00"`}>${hs.map(e => { const c = catById(e.cat); return `<div class="tl-ev ${e.done ? 'done' : ''}" style="--c:${c.color};--ci:${shade(c.color, .5)}" data-act="editEvent" data-id="${e.id}"><b>${esc(e.title)}</b><small>${e.start}${e.end ? '–' + e.end : ''} · ${esc(c.name)}</small></div>`; }).join('')}</div></div>`;
    }
    const tk = tasksDueOn(sel);
    main = `${allDay.length ? `<div class="card list">${allDay.map(e => eventItem(e)).join('')}</div>` : ''}
      <div class="card timeline">${tl}</div>
      ${tk.length ? `<div class="section-title"><h2>Tarefas do dia</h2></div><div class="card list">${tk.map(x => taskItem(x)).join('')}</div>` : ''}`;
  }
  // atrasadas e próximas
  const overdue = sortTasks(S.tasks.filter(x => !x.done && x.due && x.due < t));
  const nextEv = S.events.filter(e => e.date > t && e.date <= D.add(t, 7)).sort((a, b) => (a.date + (a.start || '')).localeCompare(b.date + (b.start || '')));
  const nextTk = sortTasks(S.tasks.filter(x => !x.done && x.due && x.due > t && x.due <= D.add(t, 7)));
  return `${pageHead('Agenda', { sub: D.long(t), right: `<button class="btn soft sm" data-act="agendaToday">Hoje</button>` })}
  <div class="seg btns">${[['day', 'Dia'], ['week', 'Semana'], ['month', 'Mês']].map(([v, l]) => `<button class="${mode === v ? 'on' : ''}" data-act="agendaMode" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="cal-nav">${nav}</div>
  ${main}
  ${overdue.length ? `<div class="section-title"><h2>Atrasadas <span class="pill bad">${overdue.length}</span></h2></div><div class="card list">${overdue.map(x => taskItem(x)).join('')}</div>` : ''}
  <div class="section-title"><h2>Próximos 7 dias</h2></div>
  <div class="card list">${nextEv.length || nextTk.length ? nextEv.map(e => eventItem(e, { showDate: true })).join('') + nextTk.map(x => taskItem(x)).join('') : `<p class="free-day">${ic('sun')} Semana tranquila por enquanto</p>`}</div>`;
};
ACT.agendaMode = el => { UI.agendaMode = el.dataset.v; render(); };
ACT.agendaToday = () => { UI.agendaDate = D.today(); render(); };
ACT.agendaNav = el => {
  const n = +el.dataset.n, m = UI.agendaMode;
  if (m === 'month') { const mk = D.addMonths(D.month(UI.agendaDate), n); UI.agendaDate = D.month(D.today()) === mk ? D.today() : D.dayOf(mk, 1); }
  else UI.agendaDate = D.add(UI.agendaDate, m === 'week' ? 7 * n : n);

ACT.pickDay = el => {

};

/* ---------- Formulário de compromisso ---------- */
function eventForm(e = {}) {
  const isNew = !e.id;
  openSheet({
    title: isNew ? 'Novo compromisso' : 'Editar compromisso',
    html: `<form class="form">
      ${field('Título', `<input name="title" required maxlength="120" placeholder="Ex.: Aula de Nutrição Clínica" value="${esc(e.title || '')}">`)}
      ${field('Data', `<input type="date" name="date" required value="${e.date || UI.agendaDate || D.today()}">`)}
      ${toggle('allDay', e.allDay, 'Dia inteiro')}
      <div class="inline-fields time-fields" ${e.allDay ? 'hidden' : ''}>${field('Início', `<input type="time" name="start" value="${e.start || ''}">`)}${field('Fim', `<input type="time" name="end" value="${e.end || ''}">`)}</div>
      ${fieldset('Categoria', chipsRadio('cat', catOptions(), e.cat || 'c_out', 'scroll'))}
      ${field('Descrição', `<textarea name="desc" rows="2" placeholder="Local, links, detalhes…">${esc(e.desc || '')}</textarea>`)}
      ${field('Lembrete', `<select name="reminder">${[[-1, 'Sem lembrete'], [0, 'Na hora'], [10, '10 min antes'], [15, '15 min antes'], [30, '30 min antes'], [60, '1 hora antes'], [1440, '1 dia antes']].map(([v, l]) => `<option value="${v}" ${+(e.reminder ?? S.settings.eventReminder) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}
      ${!isNew ? `<button type="button" class="btn ghost block" data-act="eventICS" data-id="${e.id}">${ic('calPlus')} Adicionar ao Calendário do iPhone</button>` : ''}
      <div class="btn-row">${!isNew ? `<button type="button" class="btn danger" data-act="delEvent" data-id="${e.id}">${ic('trash')}</button>` : ''}<button class="btn primary">${isNew ? 'Agendar' : 'Salvar'}</button></div>
    </form>`,
    onMount: sh => { sh.querySelector('[name=allDay]').addEventListener('change', ev => { sh.querySelector('.time-fields').hidden = ev.target.checked; }); },
    onSubmit: fd => {
      const data = { title: fd.get('title').trim(), date: fd.get('date'), allDay: !!fd.get('allDay'), start: fd.get('start') || '', end: fd.get('end') || '', cat: fd.get('cat'), desc: fd.get('desc').trim(), reminder: +fd.get('reminder') };
      if (!data.title || !data.date) return false;
      if (data.allDay) { data.start = ''; data.end = ''; }
      if (data.end && data.start && data.end < data.start) data.end = '';
      if (isNew) { S.events.push({ id: uid(), createdAt: D.today(), done: false, ...data }); toast('Compromisso agendado', 'calendar'); }
      else Object.assign(S.events.find(x => x.id === e.id), data);
      UI.agendaDate = data.date;
      refresh();
    }
  });
}
ACT.newEvent = () => eventForm({ date: UI.route === 'agenda' ? UI.agendaDate : D.today() });
ACT.newEventOn = el => eventForm({ date: el.dataset.d });
ACT.newEventAt = el => eventForm({ date: el.dataset.d, start: el.dataset.t, end: pad((+el.dataset.t.slice(0, 2) + 1) % 24) + ':00' });
ACT.editEvent = el => eventForm(S.events.find(e => e.id === el.dataset.id));
ACT.delEvent = async el => {
  if (!await ask('Este compromisso será excluído.', { ok: 'Excluir', danger: true, title: 'Excluir compromisso?' })) return;
  revoke('event:' + el.dataset.id);
  S.events = S.events.filter(e => e.id !== el.dataset.id);
  closeSheet(); refresh(); toast('Compromisso excluído', 'trash');
};

/* ---------- Exportar para o Calendário do iPhone (.ics) ---------- */
function icsDate(d, t) { return d.replace(/-/g, '') + (t ? 'T' + t.replace(':', '') + '00' : ''); }
function buildICS(evs) {
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Petala Planner//PT-BR', 'CALSCALE:GREGORIAN'];
  for (const e of evs) {
    const allDay = e.allDay || !e.start;
    lines.push('BEGIN:VEVENT', `UID:${e.id}@petala`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`, `SUMMARY:${(e.title || '').replace(/[,;]/g, ' ')}`);
    if (allDay) lines.push(`DTSTART;VALUE=DATE:${icsDate(e.date)}`, `DTEND;VALUE=DATE:${icsDate(D.add(e.date, 1))}`);
    else { lines.push(`DTSTART:${icsDate(e.date, e.start)}`); if (e.end) lines.push(`DTEND:${icsDate(e.date, e.end)}`); }
    if (e.desc) lines.push(`DESCRIPTION:${e.desc.replace(/\n/g, '\\n').replace(/[,;]/g, ' ')}`);
    lines.push(`CATEGORIES:${catById(e.cat).name}`);
    if (e.reminder >= 0) lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${(e.title || '').replace(/[,;]/g, ' ')}`, `TRIGGER:-PT${e.reminder}M`, 'END:VALARM');
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
async function shareOrDownload(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  } catch (e) { return false; }
}
ACT.eventICS = el => { const e = S.events.find(x => x.id === el.dataset.id); shareOrDownload(`${e.title.slice(0, 30) || 'compromisso'}.ics`, buildICS([e]), 'text/calendar'); };
ACT.allICS = () => {
  const evs = S.events.filter(e => e.date >= D.today());
  if (!evs.length) return toast('Nenhum compromisso futuro para exportar', 'info');
  shareOrDownload('agenda-petala.ics', buildICS(evs), 'text/calendar');
};

<script>/* js/views/habits.js */
'use strict';
/* ============================================================
   Hábitos e rotina: diários (com dias da semana) ou semanais (N vezes)
   ============================================================ */
const habitScheduled = (h, d) => h.freq === 'daily' ? (h.days || [0, 1, 2, 3, 4, 5, 6]).includes(D.weekday(d)) : true;
const weekCount = (h, ws) => D.range(ws, D.add(ws, 6)).filter(d => h.log[d]).length;
function habitsDueOn(d) {
  return S.habits.filter(h => (h.createdAt || '0') <= d && (h.freq === 'daily' ? habitScheduled(h, d) : (weekCount(h, D.weekStart(d)) - (h.log[d] ? 1 : 0)) < h.target));
}
function habitStreak(h) {
  const t = D.today();
  if (h.freq === 'weekly') {
    let w = D.weekStart(t), n = 0;
    if (weekCount(h, w) < h.target) w = D.add(w, -7);
    while (weekCount(h, w) >= h.target && n < 520) { n++; w = D.add(w, -7); }
    return n;
  }
  let d = t, n = 0, guard = 0;
  if (habitScheduled(h, d) && !h.log[d]) d = D.add(d, -1);
  while (guard++ < 1500 && d >= (h.createdAt || '2000-01-01')) {
    if (!habitScheduled(h, d)) { d = D.add(d, -1); continue; }
    if (h.log[d]) { n++; d = D.add(d, -1); } else break;
  }
  return n;
}
function habitBest(h) {
  if (h.freq === 'weekly') return Math.max(habitStreak(h), 0);
  let best = 0, cur = 0;
  for (let d = h.createdAt || D.today(); d <= D.today(); d = D.add(d, 1)) {
    if (!habitScheduled(h, d)) continue;
    if (h.log[d]) { cur++; best = Math.max(best, cur); } else if (d !== D.today()) cur = 0;
  }
  return best;
}
function habitRate(h, days = 30) {
  const t = D.today(), from = [D.add(t, -(days - 1)), h.createdAt || t].sort()[1];
  if (h.freq === 'weekly') {
    let ws = D.weekStart(from), num = 0, den = 0;
    for (; ws <= D.weekStart(t); ws = D.add(ws, 7)) {
      const c = weekCount(h, ws), cur = ws === D.weekStart(t);
      if (cur && c < h.target) continue;
      num += Math.min(c, h.target); den += h.target;
    }
    return den ? num / den : null;
  }
  let num = 0, den = 0;
  for (let d = from; d <= t; d = D.add(d, 1)) {
    if (!habitScheduled(h, d)) continue;
    if (d === t && !h.log[d]) continue;
    den++; if (h.log[d]) num++;
  }
  return den ? num / den : null;
}
const rateTxt = r => r == null ? 'novo' : pctTxt(r);
function weekHabitRate(ws) {
  let num = 0, den = 0; const t = D.today();
  for (const h of S.habits) {
    if (h.freq === 'weekly') { num += Math.min(weekCount(h, ws), h.target); den += h.target; continue; }
    for (const d of D.range(ws, D.add(ws, 6))) {
      if (d > t || d < (h.createdAt || '0') || !habitScheduled(h, d)) continue;
      if (d === t && !h.log[d]) continue;
      den++; if (h.log[d]) num++;
    }
  }
  return den ? num / den : 0;
}
function toggleHabit(id, d = D.today()) {
  const h = S.habits.find(x => x.id === id); if (!h) return;
  if (d > D.today()) return toast('Ainda não chegou esse dia ♡', 'clock');
  const key = `habit:${id}:${d}`;
  if (h.log[d]) { delete h.log[d]; revoke(key); }
  else {
    h.log[d] = true; award(key, XP.habit, 'Hábito: ' + h.name); burst(); haptic();
    const st = habitStreak(h);
    if ([3, 7, 14, 21, 30, 50, 100].includes(st)) toast(`${st} seguidos em "${esc(h.name)}"! ${ic('flame')}`, 'flame');
  }
  refresh();
}
ACT.toggleHabit = el => toggleHabit(el.dataset.id, el.dataset.d || UI.habitDate || D.today());

VIEWS.habits = () => {
  if (!UI.habitDate) UI.habitDate = D.today();
  const t = D.today(), sel = UI.habitDate;
  const due = habitsDueOn(sel), doneSel = S.habits.filter(h => h.log[sel]).length;
  const dueDone = due.filter(h => h.log[sel]).length;
  const wr = weekHabitRate(D.weekStart(t));
  const strip = D.range(D.add(t, -6), t).map(d => `<button class="wk-day ${d === t ? 'today' : ''} ${d === sel ? 'sel' : ''}" data-act="habitDay" data-d="${d}"><small>${WD[D.weekday(d)]}</small><b>${+d.slice(8)}</b><span class="mini-ring" style="--p:${Math.round(pct(S.habits.filter(h => h.log[d]).length, Math.max(1, habitsDueOn(d).length + S.habits.filter(h => h.log[d] && !habitsDueOn(d).includes(h)).length)) * 100)}"></span></button>`).join('');
  const cards = S.habits.map(h => {
    const st = habitStreak(h), rate = habitRate(h), on = !!h.log[sel];
    const sched = habitScheduled(h, sel);
    const last7 = D.range(D.add(t, -6), t).map(d => `<i class="${h.log[d] ? 'on' : ''} ${habitScheduled(h, d) ? '' : 'off'}"></i>`).join('');
    const sub = h.freq === 'weekly' ? `${weekCount(h, D.weekStart(sel))}/${h.target} na semana` : (h.days && h.days.length < 7 ? h.days.map(x => WD[x]).join(' ') : 'Todos os dias');
    return `<div class="habit-card ${on ? 'on' : ''}" style="--c:${h.color};--ci:${shade(h.color, .45)}">
      <div class="hc-main" data-act="habitDetail" data-id="${h.id}">
        <span class="cat-ic">${ic(h.icon)}</span>
        <div class="body"><b>${esc(h.name)}</b><small>${sub}</small>
          <div class="hc-stats"><span>${ic('flame')} ${st} ${h.freq === 'weekly' ? (st === 1 ? 'semana' : 'semanas') : (st === 1 ? 'dia' : 'dias')}</span><span>${rate == null ? 'Começando agora' : pctTxt(rate) + ' consistência'}</span></div>
          <div class="hc-week">${last7}</div>
        </div>
      </div>
      <button class="habit-check ${on ? 'on' : ''} ${!sched && !on ? 'rest' : ''}" data-act="toggleHabit" data-id="${h.id}" aria-label="Marcar">${ic('check')}</button>
    </div>`;
  }).join('');
  return `${pageHead('Hábitos', { sub: sel === t ? 'Hoje · ' + D.short(t) : D.long(sel) })}
  <div class="card habits-summary">
    ${ring(pct(dueDone, due.length || 1), 78, 8, `${dueDone}/${due.length}<small>${sel === t ? 'hoje' : 'no dia'}</small>`)}
    <div class="hs-txt"><b>${due.length ? (dueDone >= due.length ? 'Rotina completa! ✨' : `Faltam ${due.length - dueDone}`) : (S.habits.length ? 'Dia de descanso' : 'Crie seu primeiro hábito')}</b>
      <p class="small muted">${S.habits.length ? `Consistência da semana: <b style="color:var(--ink)">${pctTxt(wr)}</b>` : 'Beber água, ler, treinar, skincare…'}</p>
      ${S.habits.length ? progressBar(wr, '', 'thin') : ''}</div>
  </div>
  <div class="week-strip card habit-strip">${strip}</div>
  ${S.habits.length ? `<div class="habit-list">${cards}</div>` : `<div class="card">${empty('habits', 'Nenhum hábito ainda', 'Hábitos pequenos e constantes transformam a rotina.', `<button class="btn primary sm" data-act="newHabit">${ic('plus')}Criar hábito</button>`)}</div>`}`;
};
ACT.habitDay = el => { UI.habitDate = el.dataset.d; render(); };

/* ---------- Detalhe com calendário de hábito ---------- */
function habitDetail(id, mk = D.thisMonth()) {
  const h = S.habits.find(x => x.id === id); if (!h) return;
  const first = D.dayOf(mk, 1), lead = D.weekday(first), n = D.daysInMonth(mk), t = D.today();
  let cal = `<div class="cal-grid heat">${WD1.map(w => `<span class="cal-wd">${w}</span>`).join('')}`;
  for (let i = 0; i < lead; i++) cal += '<span></span>';
  for (let i = 1; i <= n; i++) {
    const d = D.dayOf(mk, i);
    cal += `<button type="button" class="heat-day ${h.log[d] ? 'on' : ''} ${d === t ? 'today' : ''} ${d > t ? 'future' : ''} ${habitScheduled(h, d) ? '' : 'rest'}" data-act="habitCalToggle" data-id="${h.id}" data-d="${d}" data-mk="${mk}">${i}</button>`;
  }
  cal += '</div>';
  const monthDone = D.range(first, D.dayOf(mk, n)).filter(d => h.log[d]).length;
  openSheet({
    title: esc(h.name),
    html: `<div class="habit-detail" style="--c:${h.color};--ci:${shade(h.color, .45)}">
      <div class="grid3">
        <div class="stat">${ic('flame')}<b>${habitStreak(h)}</b><span>sequência atual</span></div>
        <div class="stat">${ic('trophy')}<b>${habitBest(h)}</b><span>melhor sequência</span></div>
        <div class="stat">${ic('chart')}<b>${rateTxt(habitRate(h))}</b><span>consistência 30d</span></div>
      </div>
      <div class="cal-nav"><button type="button" class="icon-btn sm" data-act="habitCalNav" data-id="${h.id}" data-mk="${D.addMonths(mk, -1)}">${ic('chevL')}</button><b>${D.monthLabel(mk)}</b><button type="button" class="icon-btn sm" data-act="habitCalNav" data-id="${h.id}" data-mk="${D.addMonths(mk, 1)}">${ic('chevR')}</button></div>
      <div class="card flat">${cal}<p class="small muted" style="margin-top:10px;text-align:center">${plural(monthDone, 'dia realizado', 'dias realizados')} em ${MONTHS[+mk.slice(5) - 1].toLowerCase()} · toque num dia para marcar</p></div>
      <p class="small muted" style="margin-top:12px">Total: ${plural(Object.keys(h.log).length, 'registro')} desde ${D.shortY(h.createdAt || t)}</p>
      <div class="btn-row"><button type="button" class="btn danger" data-act="delHabit" data-id="${h.id}">${ic('trash')}</button><button type="button" class="btn soft" data-act="editHabit" data-id="${h.id}">${ic('edit')} Editar</button></div>
    </div>`
  });
}
ACT.habitDetail = el => habitDetail(el.dataset.id);
ACT.habitCalNav = el => habitDetail(el.dataset.id, el.dataset.mk);
ACT.habitCalToggle = el => {
  const d = el.dataset.d; if (d > D.today()) return;
  const h = S.habits.find(x => x.id === el.dataset.id);
  const key = `habit:${h.id}:${d}`;
  if (h.log[d]) { delete h.log[d]; revoke(key); el.classList.remove('on'); }
  else { h.log[d] = true; award(key, XP.habit, 'Hábito: ' + h.name); el.classList.add('on'); burst(); }
  save(); checkAchievements(); render();
};

function habitForm(h = {}) {
  const isNew = !h.id;
  const days = h.days || [0, 1, 2, 3, 4, 5, 6];
  openSheet({
    title: isNew ? 'Novo hábito' : 'Editar hábito',
    html: `<form class="form">
      ${field('Hábito', `<input name="name" required maxlength="60" placeholder="Ex.: Beber 2L de água" value="${esc(h.name || '')}">`)}
      ${fieldset('Frequência', segmented('freq', [{ value: 'daily', label: 'Diário' }, { value: 'weekly', label: 'Semanal' }], h.freq || 'daily'))}
      <div class="f-daily" ${h.freq === 'weekly' ? 'hidden' : ''}>${fieldset('Em quais dias?', `<div class="chips days">${WD.map((w, i) => `<label class="chip-opt"><input type="checkbox" name="days" value="${i}" ${days.includes(i) ? 'checked' : ''}><span>${w}</span></label>`).join('')}</div>`)}</div>
      <div class="f-weekly" ${h.freq === 'weekly' ? '' : 'hidden'}>${field('Quantas vezes por semana?', `<select name="target">${[1, 2, 3, 4, 5, 6, 7].map(n => `<option value="${n}" ${(h.target || 3) === n ? 'selected' : ''}>${n}x por semana</option>`).join('')}</select>`)}</div>
      ${fieldset('Ícone', iconPicker('icon', h.icon || 'sparkle'))}
      ${fieldset('Cor', colorPicker('color', h.color))}
      <div class="btn-row"><button class="btn primary">${isNew ? 'Criar hábito' : 'Salvar'}</button></div>
    </form>`,
    onMount: sh => sh.querySelectorAll('[name=freq]').forEach(r => r.addEventListener('change', () => {
      const w = sh.querySelector('[name=freq]:checked').value === 'weekly';
      sh.querySelector('.f-daily').hidden = w; sh.querySelector('.f-weekly').hidden = !w;
    })),
    onSubmit: fd => {
      const data = { name: fd.get('name').trim(), freq: fd.get('freq'), days: fd.getAll('days').map(Number), target: +fd.get('target') || 3, icon: fd.get('icon'), color: fd.get('color') };
      if (!data.name) return false;
      if (data.freq === 'daily' && !data.days.length) data.days = [0, 1, 2, 3, 4, 5, 6];
      if (isNew) { S.habits.push({ id: uid(), createdAt: D.today(), log: {}, ...data }); toast('Hábito criado', 'habits'); }
      else Object.assign(S.habits.find(x => x.id === h.id), data);
      refresh();
    }
  });
}
ACT.newHabit = () => habitForm();
ACT.editHabit = el => habitForm(S.habits.find(h => h.id === el.dataset.id));
ACT.delHabit = async el => {
  if (!await ask('Todo o histórico deste hábito será apagado.', { ok: 'Excluir', danger: true, title: 'Excluir hábito?' })) return;
  const h = S.habits.find(x => x.id === el.dataset.id);
  Object.keys(h.log).forEach(d => revoke(`habit:${h.id}:${d}`));
  S.habits = S.habits.filter(x => x.id !== h.id);
  closeSheet(); refresh();
};

</script>
<script>/* js/views/notes.js */
'use strict';
/* ============================================================
   Anotações: notas com título, categoria, fixar e busca
   ============================================================ */
VIEWS.notes = () => {
  const q = UI.noteQ.trim().toLowerCase();
  let notes = S.notes.filter(n => (UI.noteCat === 'all' || n.cat === UI.noteCat) && (!q || (n.title + ' ' + n.body).toLowerCase().includes(q)));
  notes.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.updatedAt || 0) - (a.updatedAt || 0));
  const usedCats = S.categories.filter(c => S.notes.some(n => n.cat === c.id));
  return `${pageHead('Anotações', { back: 'profile', sub: plural(S.notes.length, 'nota') })}
  <div class="search"><span>${ic('search')}</span><input class="input" type="search" placeholder="Buscar nas notas" value="${esc(UI.noteQ)}" data-input="noteSearch"></div>
  ${usedCats.length ? `<div class="scroll-x" style="margin-top:10px"><button class="fchip ${UI.noteCat === 'all' ? 'on' : ''}" data-act="noteCat" data-id="all">Todas</button>${usedCats.map(c => `<button class="fchip ${UI.noteCat === c.id ? 'on' : ''}" style="--c:${c.color}" data-act="noteCat" data-id="${c.id}"><span class="dot"></span>${esc(c.name)}</button>`).join('')}</div>` : ''}
  <div class="notes-grid" id="notes-grid">${notes.length ? notes.map(noteCard).join('') : `<div class="card" style="grid-column:1/-1">${empty('note', q ? 'Nada encontrado' : 'Sem anotações ainda', q ? 'Tente outra palavra.' : 'Ideias, lembretes, receitas, insights do estágio…', q ? '' : `<button class="btn primary sm" data-act="newNote">${ic('plus')}Nova nota</button>`)}</div>`}</div>`;
};
function noteCard(n) {
  const c = catById(n.cat);
  return `<button class="note-card" style="--c:${c.color}" data-act="editNote" data-id="${n.id}">
    ${n.pinned ? `<span class="note-pin">${ic('pin')}</span>` : ''}
    <b>${esc(n.title || 'Sem título')}</b>
    <p>${esc((n.body || '').slice(0, 160))}</p>
    <div class="note-foot">${catChip(c, true)}<small>${D.short(D.key(new Date(n.updatedAt || Date.now())))}</small></div>
  </button>`;
}
INP.noteSearch = debounce(el => {
  UI.noteQ = el.value;
  const grid = $('#notes-grid'); if (!grid) return;
  // atualiza só a grade para não perder o foco do campo
  const tmp = document.createElement('div'); tmp.innerHTML = VIEWS.notes();
  grid.replaceWith(tmp.querySelector('#notes-grid'));
}, 150);
ACT.noteCat = el => { UI.noteCat = el.dataset.id; render(); };

function noteForm(n = {}) {
  const isNew = !n.id;
  openSheet({
    title: isNew ? 'Nova anotação' : 'Editar anotação', tall: true,
    html: `<form class="form note-form">
      <input class="note-title-in" name="title" maxlength="100" placeholder="Título" value="${esc(n.title || '')}">
      <textarea class="note-body-in" name="body" placeholder="Escreva aqui suas ideias, lembretes e informações importantes…">${esc(n.body || '')}</textarea>
      ${fieldset('Categoria', chipsRadio('cat', catOptions(), n.cat || (UI.noteCat !== 'all' ? UI.noteCat : 'c_out'), 'scroll'))}
      ${toggle('pinned', n.pinned, 'Fixar no topo')}
      <div class="btn-row">${!isNew ? `<button type="button" class="btn danger" data-act="delNote" data-id="${n.id}">${ic('trash')}</button>` : ''}<button class="btn primary">Salvar nota</button></div>
    </form>`,
    onSubmit: fd => {
      const data = { title: fd.get('title').trim(), body: fd.get('body'), cat: fd.get('cat'), pinned: !!fd.get('pinned'), updatedAt: Date.now() };
      if (!data.title && !data.body.trim()) return false;
      if (isNew) {
        const id = uid();
        S.notes.push({ id, createdAt: D.today(), ...data });
        if (awardsToday('note:') < 5) award('note:' + id, XP.note, 'Anotação');
        toast('Nota salva', 'note');
      } else Object.assign(S.notes.find(x => x.id === n.id), data);
      refresh();
    }
  });
}
ACT.newNote = () => noteForm();
ACT.editNote = el => noteForm(S.notes.find(n => n.id === el.dataset.id));
ACT.delNote = async el => {
  if (!await ask('A anotação será excluída permanentemente.', { ok: 'Excluir', danger: true, title: 'Excluir nota?' })) return;
  revoke('note:' + el.dataset.id);
  S.notes = S.notes.filter(n => n.id !== el.dataset.id);
  closeSheet(); refresh();
};

/* Anotação rápida da página inicial (salva enquanto digita) */
INP.quickNote = debounce(el => { S.quickNote = el.value; save(); const s = $('#qn-status'); if (s) { s.textContent = 'Salvo ✓'; setTimeout(() => s.textContent = '', 1200); } }, 300);
ACT.quickToNote = () => {
  if (!S.quickNote.trim()) return toast('Escreva algo primeiro', 'note');
  const id = uid(); const first = S.quickNote.trim().split('\n')[0].slice(0, 60);
  S.notes.push({ id, createdAt: D.today(), title: first, body: S.quickNote, cat: 'c_out', pinned: false, updatedAt: Date.now() });
  if (awardsToday('note:') < 5) award('note:' + id, XP.note, 'Anotação');
  S.quickNote = ''; refresh(); toast('Virou uma anotação ✨', 'note');
};

</script>
<script>/* js/views/goals.js */
'use strict';
/* ============================================================
   Metas: pessoais, acadêmicas e profissionais, com etapas
   ============================================================ */
const GOAL_TYPES = { pessoal: { label: 'Pessoal', icon: 'heart', color: '#F5B4CC' }, academica: { label: 'Acadêmica', icon: 'grad', color: '#C7B5EE' }, profissional: { label: 'Profissional', icon: 'briefcase', color: '#A8D8E8' } };
function goalProgress(g) {
  const steps = g.steps || [], linked = S.tasks.filter(t => t.goal === g.id);
  const total = steps.length + linked.length;
  if (g.done) return 1;
  if (!total) return (g.manual || 0) / 100;
  return (steps.filter(s => s.done).length + linked.filter(t => t.done).length) / total;
}
function goalCard(g) {
  const p = goalProgress(g), ty = GOAL_TYPES[g.type] || GOAL_TYPES.pessoal;
  const left = g.deadline ? D.diff(g.deadline, D.today()) : null;
  const steps = (g.steps || []).length + S.tasks.filter(t => t.goal === g.id).length;
  return `<button class="goal-card card ${g.done ? 'done' : ''}" data-act="goalDetail" data-id="${g.id}" style="--c:${ty.color};--ci:${shade(ty.color, .45)}">
    <div class="row"><span class="cat-ic">${ic(g.done ? 'trophy' : ty.icon)}</span><div style="flex:1;min-width:0;text-align:left"><b class="gc-title">${esc(g.title)}</b>
    <div class="meta"><span class="pill gray">${ty.label}</span>${g.deadline ? `<span class="${left < 0 && !g.done ? 'late' : ''}">${ic('clock')} ${g.done ? 'Concluída' : left < 0 ? 'Prazo passou' : left === 0 ? 'Termina hoje' : `${plural(left, 'dia')}`}</span>` : ''}${steps ? `<span>${ic('list')} ${steps} etapas</span>` : ''}</div></div>
    <b class="gc-pct">${Math.round(p * 100)}%</b></div>
    ${progressBar(p, '', 'fat')}
  </button>`;
}
VIEWS.goals = () => {
  const act = S.goals.filter(g => !g.done), done = S.goals.filter(g => g.done);
  const shown = UI.goalFilter === 'done' ? done : act;
  return `${pageHead('Metas', { back: 'profile', sub: `${act.length} em andamento · ${done.length} concluídas` })}
  <div class="seg btns" style="margin-bottom:14px"><button class="${UI.goalFilter !== 'done' ? 'on' : ''}" data-act="goalFilter" data-v="active">Em andamento</button><button class="${UI.goalFilter === 'done' ? 'on' : ''}" data-act="goalFilter" data-v="done">Conquistadas</button></div>
  ${shown.length ? `<div class="stack">${shown.map(goalCard).join('')}</div>` : `<div class="card">${empty('target', UI.goalFilter === 'done' ? 'Ainda sem metas concluídas' : 'Defina sua primeira meta', 'Divida grandes sonhos em pequenas etapas e acompanhe o progresso.', `<button class="btn primary sm" data-act="newGoal">${ic('plus')}Nova meta</button>`)}</div>`}`;
};
ACT.goalFilter = el => { UI.goalFilter = el.dataset.v; render(); };

function goalDetail(id) {
  const g = S.goals.find(x => x.id === id); if (!g) return;
  const p = goalProgress(g), ty = GOAL_TYPES[g.type] || GOAL_TYPES.pessoal;
  const linked = S.tasks.filter(t => t.goal === g.id);
  const noSteps = !(g.steps || []).length && !linked.length;
  openSheet({
    title: esc(g.title), tall: true,
    html: `<div class="goal-detail">
      <div class="row" style="gap:14px">${ring(p, 82, 8, `${Math.round(p * 100)}%`)}<div><span class="pill gray">${ty.label}</span>
        <p class="small muted" style="margin-top:6px">${g.deadline ? `Prazo: <b style="color:var(--ink)">${D.shortY(g.deadline)}</b>` : 'Sem prazo definido'}</p>
        ${g.desc ? `<p class="small" style="margin-top:6px">${esc(g.desc)}</p>` : ''}</div></div>
      <div class="section-title"><h2>Etapas</h2></div>
      <div class="card flat list">${(g.steps || []).map(s => `<div class="item ${s.done ? 'done' : ''}"><button type="button" class="check ${s.done ? 'on' : ''}" data-act="toggleStep" data-g="${g.id}" data-s="${s.id}">${ic('check')}</button><div class="body"><div class="title">${esc(s.title)}</div></div><button type="button" class="icon-btn sm soft" data-act="delStep" data-g="${g.id}" data-s="${s.id}" aria-label="Remover">${ic('x')}</button></div>`).join('')}
      ${linked.map(t => taskItem(t, { hideList: true })).join('')}
      ${noSteps ? '<p class="free-day">Adicione etapas para acompanhar o progresso automaticamente.</p>' : ''}
      <form class="add-inline" id="step-form"><input name="step" placeholder="Nova etapa…" maxlength="100"><button class="btn soft sm">${ic('plus')}</button></form></div>
      ${noSteps && !g.done ? `<div class="field" style="margin-top:14px"><span class="field-label">Progresso manual: <b id="mp-v">${g.manual || 0}%</b></span><input type="range" min="0" max="100" step="5" value="${g.manual || 0}" data-change="goalManual" data-input="goalManualPreview" data-id="${g.id}" class="range"></div>` : ''}
      <div class="btn-row"><button type="button" class="btn danger" data-act="delGoal" data-id="${g.id}">${ic('trash')}</button><button type="button" class="btn soft" data-act="editGoal" data-id="${g.id}">${ic('edit')}</button>
      ${g.done ? `<button type="button" class="btn ghost" data-act="reopenGoal" data-id="${g.id}">Reabrir</button>` : `<button type="button" class="btn primary" data-act="completeGoal" data-id="${g.id}">${ic('trophy')} Concluir</button>`}</div>
    </div>`,
    onMount: sh => sh.querySelector('#step-form').addEventListener('submit', e => {
      e.preventDefault();
      const v = e.target.step.value.trim(); if (!v) return;
      g.steps = g.steps || []; g.steps.push({ id: uid(), title: v, done: false });
      save(); render(); goalDetail(g.id);
      setTimeout(() => $('#step-form input')?.focus(), 350);
    })
  });
}
ACT.goalDetail = el => goalDetail(el.dataset.id);
ACT.toggleStep = el => {
  const g = S.goals.find(x => x.id === el.dataset.g), s = g.steps.find(x => x.id === el.dataset.s);
  s.done = !s.done; s.doneAt = s.done ? D.today() : null;
  const key = `step:${g.id}:${s.id}`;
  if (s.done) { award(key, XP.goalStep, 'Etapa: ' + s.title); burst(); } else revoke(key);
  refresh(); goalDetail(g.id);
  if (s.done && goalProgress(g) >= 1 && !g.done) setTimeout(() => toast('Todas as etapas feitas! Conclua a meta 🏆', 'trophy'), 500);
};
ACT.delStep = el => { const g = S.goals.find(x => x.id === el.dataset.g); revoke(`step:${g.id}:${el.dataset.s}`); g.steps = g.steps.filter(s => s.id !== el.dataset.s); refresh(); goalDetail(g.id); };
INP.goalManualPreview = el => { const v = $('#mp-v'); if (v) v.textContent = el.value + '%'; };
CHG.goalManual = el => { const g = S.goals.find(x => x.id === el.dataset.id); g.manual = +el.value; save(); render(); };
ACT.completeGoal = el => {
  const g = S.goals.find(x => x.id === el.dataset.id); g.done = true; g.doneAt = D.today();
  award('goal:' + g.id, XP.goalDone, 'Meta: ' + g.title, { silent: true });
  closeSheet(); refresh();
  celebrate({ title: 'Meta conquistada!', text: `"${esc(g.title)}" concluída. +${XP.goalDone} XP. Você é incrível!`, icon: 'trophy' });
};
ACT.reopenGoal = el => { const g = S.goals.find(x => x.id === el.dataset.id); g.done = false; revoke('goal:' + g.id); refresh(); goalDetail(g.id); };
ACT.delGoal = async el => {
  if (!await ask('A meta e suas etapas serão excluídas. Tarefas vinculadas continuam na lista.', { ok: 'Excluir', danger: true, title: 'Excluir meta?' })) return;
  const g = S.goals.find(x => x.id === el.dataset.id);
  revoke('goal:' + g.id); (g.steps || []).forEach(s => revoke(`step:${g.id}:${s.id}`));
  S.tasks.forEach(t => { if (t.goal === g.id) t.goal = null; });
  S.goals = S.goals.filter(x => x.id !== g.id);
  closeSheet(); refresh();
};
function goalForm(g = {}) {
  const isNew = !g.id;
  openSheet({
    title: isNew ? 'Nova meta' : 'Editar meta',
    html: `<form class="form">
      ${field('Meta', `<input name="title" required maxlength="100" placeholder="Ex.: Passar em Bioquímica com nota 8" value="${esc(g.title || '')}">`)}
      ${fieldset('Tipo', chipsRadio('type', Object.entries(GOAL_TYPES).map(([k, v]) => ({ value: k, label: v.label, icon: v.icon, color: v.color })), g.type || 'pessoal'))}
      ${field('Prazo', `<input type="date" name="deadline" value="${g.deadline || ''}">`)}
      ${field('Por que essa meta importa?', `<textarea name="desc" rows="2" placeholder="Opcional">${esc(g.desc || '')}</textarea>`)}
      ${isNew ? field('Primeiras etapas (uma por linha)', `<textarea name="steps" rows="3" placeholder="Revisar matéria\nFazer lista de exercícios\nSimulado"></textarea>`) : ''}
      <div class="btn-row"><button class="btn primary">${isNew ? 'Criar meta' : 'Salvar'}</button></div>
    </form>`,
    onSubmit: fd => {
      const data = { title: fd.get('title').trim(), type: fd.get('type'), deadline: fd.get('deadline') || null, desc: fd.get('desc').trim() };
      if (!data.title) return false;
      if (isNew) {
        const steps = (fd.get('steps') || '').split('\n').map(s => s.trim()).filter(Boolean).map(s => ({ id: uid(), title: s, done: false }));
        S.goals.push({ id: uid(), createdAt: D.today(), done: false, manual: 0, steps, ...data }); toast('Meta criada. Vamos juntas!', 'target');
      } else Object.assign(S.goals.find(x => x.id === g.id), data);
      refresh();
    }
  });
}
ACT.newGoal = () => goalForm();
ACT.editGoal = el => goalForm(S.goals.find(g => g.id === el.dataset.id));

</script>
<script>/* js/views/profile.js */
'use strict';
/* ============================================================
   Perfil, conquistas, personalização, categorias e configurações
   ============================================================ */
const AVATARS = ['🌸', '🌷', '🦋', '🌙', '✨', '🍓', '🎀', '💜', '🌼', '🐰', '🍒', '☁️', '🫧', '🧁', '🌺', '💐'];
const ACCENTS = [{ id: 'rosa', name: 'Rosa', c: '#EE93B4' }, { id: 'lilas', name: 'Lilás', c: '#A98FE0' }, { id: 'lavanda', name: 'Lavanda', c: '#9FA8EA' }, { id: 'pessego', name: 'Pêssego', c: '#F0A58E' }];

VIEWS.profile = () => {
  const L = levelInfo(), st = productiveStreak();
  const nAch = Object.keys(S.game.achievements).length;
  const menu = [
    ['money', 'wallet', 'Meu dinheiro', 'Saldo, gastos, cartões e metas', '#B8E0C8'],
    ['goals', 'target', 'Metas', `${S.goals.filter(g => !g.done).length} em andamento`, '#A98FE0'],
    ['notes', 'note', 'Anotações', plural(S.notes.length, 'nota'), '#F9DE8E'],
    ['achievements', 'trophy', 'Conquistas e desafios', `${nAch}/${ACHIEVEMENTS.length} medalhas`, '#F5B4CC'],
    ['categories', 'tag', 'Categorias', 'Cores, ícones e novas categorias', '#A8D8E8'],
    ['settings', 'sliders', 'Configurações', 'Perfil, aparência, lembretes e backup', '#C7B5EE'],
    ['install', 'phone', 'Instalar no iPhone', 'Use como um app de verdade', '#F7C6A3'],
  ];
  return `${pageHead('Perfil')}
  <div class="card profile-hero">
    <button class="avatar" data-act="go" data-to="settings">${S.profile.avatar || '🌸'}</button>
    <h2>${esc(S.profile.name || 'Você')}</h2>
    ${S.profile.bio ? `<p class="muted small">${esc(S.profile.bio)}</p>` : ''}
    <div class="lvl-row"><span class="pill">${ic('star')} Nível ${L.lvl} · ${L.title}</span><span class="pill lil">${ic('flame')} ${plural(st, 'dia')}</span></div>
    <div class="xp-wrap">${progressBar(L.pct, '', 'fat')}<div class="row between small muted" style="margin-top:6px"><span>${S.game.xp} XP no total</span><span>faltam ${L.toNext} XP</span></div></div>
  </div>
  <div class="grid3" style="margin-top:12px">
    <div class="stat">${ic('tasks')}<b>${doneTasks()}</b><span>tarefas feitas</span></div>
    <div class="stat">${ic('flame')}<b>${bestProductiveStreak()}</b><span>melhor sequência</span></div>
    <div class="stat">${ic('medal')}<b>${nAch}</b><span>conquistas</span></div>
  </div>
  <div class="card menu-list" style="margin-top:14px">${menu.map(([to, icon, t, s, c]) => `<button class="menu-row" data-act="go" data-to="${to}"><span class="cat-ic" style="--c:${c};--ci:${shade(c, .45)}">${ic(icon)}</span><span class="body"><b>${t}</b><small>${s}</small></span>${ic('chevR', 'chev')}</button>`).join('')}</div>
  <p class="foot-note">Pétala · seus dados ficam só neste aparelho ${ic('heart')}</p>`;
};

/* ---------- Conquistas e desafios ---------- */
function challengeRow(c) {
  return `<div class="chal ${c.claimed ? 'claimed' : c.done ? 'ready' : ''}">
    <span class="chal-ic">${ic(c.icon)}</span>
    <div class="body"><b>${esc(c.title)}</b>${progressBar(pct(c.progress, c.target), '', 'thin')}<small>${c.progress}${c.unit || ''}/${c.target}${c.unit || ''} · +${c.xp} XP</small></div>
    ${c.claimed ? `<span class="pill ok">${ic('check')}Feito</span>` : c.done ? `<button class="btn primary sm" data-act="claim" data-k="${c.awardKey}">Resgatar</button>` : ''}
  </div>`;
}
ACT.claim = el => { claimChallenge(el.dataset.k); refresh(); };
VIEWS.achievements = () => {
  const L = levelInfo();

    const on = S.game.achievements[a.id];
    return `<div class="medal ${on ? 'on' : ''}"><span class="medal-ic">${ic(on ? a.icon : 'lock')}</span><b>${a.name}</b><small>${on ? 'Desde ' + D.short(on) : a.desc}</small></div>`;
  }).join('');
  return `${pageHead('Conquistas', { back: 'profile', sub: `Nível ${L.lvl} · ${L.title}` })}
  <div class="card level-card">${ring(L.pct, 86, 9, `<span class="lvl-n">${L.lvl}</span><small>nível</small>`)}
    <div><b>${L.title}</b><p class="small muted">${L.cur}/${L.need} XP para o nível ${L.lvl + 1}</p><p class="small" style="margin-top:6px">${ic('flame')} Sequência produtiva: <b>${plural(productiveStreak(), 'dia')}</b></p><p class="hint" style="margin-top:4px">Um dia é produtivo quando você completa ${S.settings.dailyGoal}+ ações.</p></div></div>

  <div class="section-title"><h2>Medalhas</h2><span class="muted small">${Object.keys(S.game.achievements).length}/${ACHIEVEMENTS.length}</span></div>
  <div class="medals">${ach(false)}</div>
  <div class="section-title"><h2>Medalhas financeiras</h2></div>
  <div class="medals">${ach(true)}</div>
  <div class="section-title"><h2>Últimos pontos</h2></div>
  <div class="card list">${S.game.log.length ? S.game.log.slice(0, 15).map(l => `<div class="item"><div class="body"><div class="title" style="font-weight:550;font-size:14.5px">${esc(l.label)}</div><div class="meta">${D.rel(l.d)}</div></div><span class="pill">+${l.xp} XP</span></div>`).join('') : `<p class="free-day">Conclua tarefas e hábitos para ganhar XP ✨</p>`}</div>

/* ---------- Categorias ---------- */
VIEWS.categories = () => {
  const tab = UI.catTab;
  const rows = tab === 'life'
    ? S.categories.map(c => `<button class="menu-row" data-act="editCat" data-id="${c.id}">${catDot(c)}<span class="body"><b>${esc(c.name)}</b><small>${S.tasks.filter(t => t.cat === c.id).length} tarefas · ${S.events.filter(e => e.cat === c.id).length} compromissos</small></span>${ic('chevR', 'chev')}</button>`).join('')
    : ['expense', 'income'].map(k => `<div class="group-label">${k === 'expense' ? 'Despesas' : 'Receitas'}</div>${finCats(k).map(c => `<button class="menu-row" data-act="editFinCat" data-id="${c.id}">${catDot(c)}<span class="body"><b>${esc(c.name)}</b><small>${k === 'expense' && c.budget ? 'Orçamento ' + money(c.budget) : S.fin.tx.filter(t => t.cat === c.id).length + ' lançamentos'}</small></span>${ic('chevR', 'chev')}</button>`).join('')}`).join('');
  return `${pageHead('Categorias', { back: 'profile' })}
  <div class="seg btns" style="margin-bottom:14px"><button class="${tab === 'life' ? 'on' : ''}" data-act="catTab" data-v="life">Vida e rotina</button><button class="${tab === 'fin' ? 'on' : ''}" data-act="catTab" data-v="fin">Finanças</button></div>
  <div class="card menu-list">${rows}</div>
  <button class="btn soft block" style="margin-top:14px" data-act="${tab === 'life' ? 'newCat' : 'newFinCat'}">${ic('plus')} Nova categoria</button>`;
};
ACT.catTab = el => { UI.catTab = el.dataset.v; render(); };
function catForm(c = {}, fin = false) {
  const isNew = !c.id;
  openSheet({
    title: isNew ? 'Nova categoria' : 'Editar categoria',
    html: `<form class="form">
      ${field('Nome', `<input name="name" required maxlength="40" value="${esc(c.name || '')}" placeholder="Ex.: Viagens">`)}
      ${fin && isNew ? fieldset('Tipo', segmented('kind', [{ value: 'expense', label: 'Despesa' }, { value: 'income', label: 'Receita' }], 'expense')) : ''}
      ${fieldset('Cor', colorPicker('color', c.color))}
      ${fieldset('Ícone', iconPicker('icon', c.icon || 'sparkle'))}
      ${fin && (c.kind || 'expense') === 'expense' ? field('Orçamento mensal (opcional)', `<input name="budget" inputmode="decimal" placeholder="R$ 0,00" value="${centsToInput(c.budget)}">`) : ''}
      <div class="btn-row">${!isNew && !['c_out', 'fe_out', 'fi_out'].includes(c.id) ? `<button type="button" class="btn danger" data-act="${fin ? 'delFinCat' : 'delCat'}" data-id="${c.id}">${ic('trash')}</button>` : ''}<button class="btn primary">Salvar</button></div>
    </form>`,
    onSubmit: fd => {
      const data = { name: fd.get('name').trim(), color: fd.get('color'), icon: fd.get('icon') };
      if (fd.has('budget')) data.budget = parseMoney(fd.get('budget'));
      if (!data.name) return false;
      if (fin) {
        if (isNew) S.fin.cats.push({ id: (fd.get('kind') === 'income' ? 'fic_' : 'fec_') + uid(), kind: fd.get('kind'), ...data });
        else Object.assign(S.fin.cats.find(x => x.id === c.id), data);
      } else {
        if (isNew) S.categories.push({ id: 'cc_' + uid(), ...data });
        else Object.assign(S.categories.find(x => x.id === c.id), data);
      }
      toast('Categoria salva', 'tag'); refresh();
    }
  });
}
ACT.newCat = () => catForm();
ACT.editCat = el => catForm(S.categories.find(c => c.id === el.dataset.id));
ACT.newFinCat = () => catForm({}, true);
ACT.editFinCat = el => catForm(S.fin.cats.find(c => c.id === el.dataset.id), true);
ACT.delCat = async el => {
  const id = el.dataset.id;
  if (!await ask('Itens desta categoria serão movidos para "Outros".', { ok: 'Excluir', danger: true, title: 'Excluir categoria?' })) return;
  [S.tasks, S.events, S.notes].forEach(arr => arr.forEach(x => { if (x.cat === id) x.cat = 'c_out'; }));
  S.categories = S.categories.filter(c => c.id !== id); closeSheet(); refresh();
};
ACT.delFinCat = async el => {
  const c = S.fin.cats.find(x => x.id === el.dataset.id);
  if (!await ask('Lançamentos desta categoria serão movidos para "Outros".', { ok: 'Excluir', danger: true, title: 'Excluir categoria?' })) return;
  const to = c.kind === 'income' ? 'fi_out' : 'fe_out';
  S.fin.tx.forEach(t => { if (t.cat === c.id) t.cat = to; });
  S.fin.recurrences.forEach(r => { if (r.cat === c.id) r.cat = to; });
  S.fin.cats = S.fin.cats.filter(x => x.id !== c.id); closeSheet(); refresh();
};

/* ---------- Configurações ---------- */
VIEWS.settings = () => {
  const s = S.settings;
  const notifSupported = 'Notification' in window;
  return `${pageHead('Configurações', { back: 'profile' })}
  <div class="section-title"><h2>Informações pessoais</h2></div>
  <form class="card form" id="profile-form">
    ${fieldset('Avatar', `<div class="avatars">${AVATARS.map(a => `<label><input type="radio" name="avatar" value="${a}" ${S.profile.avatar === a ? 'checked' : ''}><span>${a}</span></label>`).join('')}</div>`)}
    ${field('Como quer ser chamada?', `<input name="name" maxlength="30" value="${esc(S.profile.name)}" placeholder="Seu nome">`)}
    ${field('Uma frase sobre você', `<input name="bio" maxlength="80" value="${esc(S.profile.bio || '')}" placeholder="Ex.: Nutri em formação & confeiteira">`)}
    <button class="btn primary">Salvar perfil</button>
  </form>
  <div class="section-title"><h2>Aparência</h2></div>
  <div class="card"><p class="small muted" style="margin-bottom:10px">Cor de destaque do app</p><div class="accents">${ACCENTS.map(a => `<button class="accent-opt ${s.accent === a.id ? 'on' : ''}" style="--c:${a.c}" data-act="setAccent" data-v="${a.id}"><span></span>${a.name}</button>`).join('')}</div></div>
  <div class="section-title"><h2>Metas e rotina</h2></div>
  <div class="card">
    ${field('Meta diária de ações', `<select data-change="dailyGoal">${[1, 2, 3, 4, 5, 6, 8, 10].map(n => `<option value="${n}" ${s.dailyGoal === n ? 'selected' : ''}>${n} ações por dia</option>`).join('')}</select>`)}
    <p class="hint" style="margin-top:6px">Tarefas, hábitos, compromissos e etapas concluídas contam para o dia produtivo e para a sequência (streak).</p>
  </div>
  <div class="section-title"><h2>Notificações e lembretes</h2></div>
  <div class="card">
    ${toggle('notif', s.notifications, 'Ativar notificações', notifSupported ? 'Lembretes de compromissos e hábitos' : 'Instale o app na tela inicial para liberar')}
    ${field('Lembrete diário de hábitos', `<input type="time" value="${s.habitReminder || ''}" data-change="habitReminder">`)}
    ${field('Lembrete padrão de compromissos', `<select data-change="eventReminder">${[[-1, 'Sem lembrete'], [0, 'Na hora'], [10, '10 min antes'], [15, '15 min antes'], [30, '30 min antes'], [60, '1 hora antes']].map(([v, l]) => `<option value="${v}" ${s.eventReminder === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}
    <button class="btn ghost block" style="margin-top:12px" data-act="allICS">${ic('calPlus')} Enviar compromissos ao Calendário do iPhone</button>
    <p class="hint" style="margin-top:8px">No iPhone, a web só consegue notificar com o app aberto ou em segundo plano recente. Para alarmes garantidos mesmo com o app fechado, envie os compromissos ao Calendário do iPhone (eles vão com o lembrete configurado).</p>
  </div>
  <div class="section-title"><h2>Privacidade</h2></div>
  <div class="card">${toggle('hide', s.hideValues, 'Ocultar valores em reais', 'Mostra R$ ••••• até você tocar no olho')}</div>
  <div class="section-title"><h2>Seus dados</h2></div>
  <div class="card">
    <p class="small muted" style="margin-bottom:12px">${STORAGE_OK ? `${ic('check')} Tudo salvo automaticamente neste aparelho.` : `${ic('alert')} Este navegador bloqueou o armazenamento. Instale o app para salvar.`} ${s.lastBackup ? `Último backup: ${D.shortY(s.lastBackup)}.` : 'Nenhum backup ainda.'}</p>
    <div class="btn-row" style="margin-top:0"><button class="btn soft" data-act="exportBackup">${ic('download')} Exportar</button><label class="btn soft">${ic('upload')} Importar<input type="file" accept="application/json,.json" hidden data-change="importBackup"></label></div>
    <button class="btn ghost block" style="margin-top:10px" data-act="copyBackup">Copiar backup (texto)</button>
    <button class="btn danger block" style="margin-top:10px" data-act="resetAll">Apagar todos os dados</button>
  </div>
  <p class="foot-note">Pétala Planner · v1.0</p>`;
};
MOUNTS.settings = () => {
  const f = $('#profile-form');
  f.addEventListener('submit', e => { e.preventDefault(); const fd = new FormData(f); S.profile.name = fd.get('name').trim(); S.profile.bio = fd.get('bio').trim(); S.profile.avatar = fd.get('avatar') || S.profile.avatar; toast('Perfil atualizado ♡', 'user'); refresh(); });
  $('[name=notif]').addEventListener('change', async e => {
    if (e.target.checked) {
      const ok = await enableNotifications();
      S.settings.notifications = ok; e.target.checked = ok;
      toast(ok ? 'Notificações ativadas' : 'Permissão não concedida. Instale o app na tela inicial e tente de novo.', ok ? 'bell' : 'info');
    } else S.settings.notifications = false;
    save();
  });
  $('[name=hide]').addEventListener('change', e => { S.settings.hideValues = e.target.checked; save(); });
};
ACT.setAccent = el => { S.settings.accent = el.dataset.v; applyAccent(); refresh(); };
CHG.dailyGoal = el => { S.settings.dailyGoal = +el.value; refresh(); };
CHG.habitReminder = el => { S.settings.habitReminder = el.value; save(); };
CHG.eventReminder = el => { S.settings.eventReminder = +el.value; save(); };
function applyAccent() {
  document.documentElement.dataset.accent = S.settings.accent;
  const m = $('meta[name=theme-color]'); if (m) m.content = '#FFFAFC';
}
ACT.exportBackup = async () => {
  const ok = await shareOrDownload(`petala-backup-${D.today()}.json`, exportData(), 'application/json');
  if (ok) { S.settings.lastBackup = D.today(); save(); toast('Backup gerado', 'download'); }
  else ACT.copyBackup();
};
ACT.copyBackup = async () => {
  try { await navigator.clipboard.writeText(exportData()); S.settings.lastBackup = D.today(); save(); toast('Backup copiado. Cole em uma nota segura.', 'check'); }
  catch (e) { toast('Não foi possível copiar aqui', 'info'); }
};
CHG.importBackup = el => {
  const file = el.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = async () => {
    if (!await ask('Os dados atuais serão substituídos pelos do backup.', { ok: 'Importar', title: 'Importar backup?' })) return;
    try { importData(r.result); applyAccent(); render(true); toast('Backup restaurado ✨', 'check'); } catch (e) { toast('Arquivo inválido', 'alert'); }
  };
  r.readAsText(file);
};
ACT.resetAll = async () => {
  if (!await ask('Tudo será apagado deste aparelho: tarefas, agenda, hábitos, finanças e XP. Faça um backup antes.', { ok: 'Apagar tudo', danger: true, title: 'Tem certeza?' })) return;
  if (!await ask('Essa ação não pode ser desfeita.', { ok: 'Sim, apagar', danger: true, title: 'Última confirmação' })) return;
  resetAll(); applySeeds(); applyAccent(); go('home'); render(true); showOnboarding();
};

    <div class="ist"><span>4</span><p>Confirme o nome <b>Pétala</b> e toque em <b>Adicionar</b>. Pronto: o ícone aparece na tela inicial e abre em tela cheia, sem barra do navegador.</p></div>

    <p>${ic('sun')} <b>Offline:</b> depois de aberto uma vez, o app funciona sem internet.</p>
  </div>`;
};
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

function showOnboarding() {
  openSheet({
    title: 'Bem-vinda ao Pétala ✿',
    html: `<form class="form">
      <p class="muted">Sua agenda pessoal para organizar estudos, estágio, trabalho, Docico, saúde, hábitos e dinheiro, tudo num lugar só.</p>
      ${field('Como quer ser chamada?', `<input name="name" maxlength="30" required placeholder="Seu nome">`)}
      ${fieldset('Escolha um avatar', `<div class="avatars">${AVATARS.slice(0, 8).map((a, i) => `<label><input type="radio" name="avatar" value="${a}" ${i === 0 ? 'checked' : ''}><span>${a}</span></label>`).join('')}</div>`)}
      ${field('Saldo atual da sua conta (opcional)', `<input name="bal" inputmode="decimal" placeholder="R$ 0,00">`)}
      ${field('Dinheiro em espécie (opcional)', `<input name="cash" inputmode="decimal" placeholder="R$ 0,00">`)}
      <button class="btn primary block">Começar ✨</button>
    </form>`,
    onSubmit: fd => {
      S.profile.name = fd.get('name').trim(); S.profile.avatar = fd.get('avatar'); S.profile.onboarded = true;
      S.fin.accounts[0] && (S.fin.accounts[0].initial = parseMoney(fd.get('bal')));
      S.fin.accounts[1] && (S.fin.accounts[1].initial = parseMoney(fd.get('cash')));
      refresh(); confetti(); toast(`Que bom te ver, ${esc(S.profile.name)}!`, 'heart');
    },
    onClose: () => { if (!S.profile.onboarded) { S.profile.onboarded = true; save(); } }
  });
}

</script>
<script>/* js/views/home.js */
'use strict';
/* ============================================================
   Página inicial (dashboard)
   ============================================================ */
function greeting() { const h = new Date().getHours(); return h < 5 ? 'Boa noite' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }

VIEWS.home = () => {
  const t = D.today(), L = levelInfo(), st = productiveStreak();
  const act = activityOn(t), goal = Math.max(1, S.settings.dailyGoal);
  const ev = eventsOn(t), tasks = homeTasks(5), habits = habitsDueOn(t).concat(S.habits.filter(h => h.log[t] && !habitsDueOn(t).includes(h)));
  const ws = D.weekStart(t);
  const ms = monthSummary(D.thisMonth()), bal = totalBalance();
  const lim = S.fin.monthlyLimit, used = pct(ms.expense, lim);
  const ch = dailyChallenges();
  const ready = ch.filter(c => c.done && !c.claimed).length;
  const msg = act >= goal ? 'Meta do dia batida! Você está brilhando ✨' : act ? `Faltam ${goal - act} para sua meta do dia` : 'Vamos começar o dia com leveza?';
  return `
  <header class="home-head">
    <div><p class="eyebrow">${D.long(t)}</p><h1>${greeting()}, <em>${esc(S.profile.name || 'linda')}</em></h1></div>
    <button class="avatar sm" data-act="go" data-to="profile" aria-label="Perfil">${S.profile.avatar || '🌸'}</button>
  </header>

  <div class="quote-card"><span class="q-ic">${ic('logo')}</span><p>${quoteOfDay(t)}</p></div>

  <div class="card day-card">
    ${ring(act / goal, 84, 9, `${Math.min(act, goal)}/${goal}<small>meta do dia</small>`)}
    <div class="dc-txt">
      <b>${msg}</b>
      <div class="dc-pills"><span class="pill">${ic('star')} Nív. ${L.lvl} · ${L.title}</span><span class="pill lil">${ic('flame')} ${st}</span></div>
      ${progressBar(L.pct, '', 'thin')}<small class="muted">${L.cur}/${L.need} XP para o próximo nível</small>
    </div>
  </div>

  <div class="card mini-week">
    <div class="card-head"><h3>${ic('calendar')}${MONTHS[+t.slice(5, 7) - 1]}</h3><button class="link" data-act="go" data-to="agenda">Ver agenda ${ic('chevR')}</button></div>
    <div class="week-row">${D.range(ws, D.add(ws, 6)).map(d => `<button class="wk-day ${d === t ? 'today' : ''}" data-act="pickDay" data-d="${d}"><small>${WD1[D.weekday(d)]}</small><b>${+d.slice(8)}</b>${dayDots(d)}</button>`).join('')}</div>
  </div>

  <div class="section-title"><h2>Hoje na agenda</h2><button class="link" data-act="newEvent">${ic('plus')} Novo</button></div>
  <div class="card list">${ev.length ? ev.map(e => eventItem(e)).join('') : `<p class="free-day">${ic('sun')} Nenhum compromisso hoje</p>`}</div>

  <div class="section-title"><h2>Tarefas pendentes</h2><button class="link" data-act="go" data-to="tasks">Todas ${ic('chevR')}</button></div>
  <div class="card list">${tasks.length ? tasks.map(x => taskItem(x)).join('') : `<p class="free-day">${ic('check')} Tudo em dia por aqui</p>`}
    <button class="add-row" data-act="newTask">${ic('plus')} Adicionar tarefa</button></div>

  ${S.habits.length ? `<div class="section-title"><h2>Hábitos de hoje</h2><button class="link" data-act="go" data-to="habits">Ver ${ic('chevR')}</button></div>
  <div class="habit-chips">${habits.map(h => `<button class="hchip ${h.log[t] ? 'on' : ''}" style="--c:${h.color};--ci:${shade(h.color, .45)}" data-act="toggleHabit" data-id="${h.id}" data-d="${t}"><span>${ic(h.log[t] ? 'check' : h.icon)}</span>${esc(h.name)}</button>`).join('') || '<p class="muted small">Dia de descanso dos hábitos ♡</p>'}</div>` : ''}

  <div class="section-title"><h2>Desafios do dia</h2><button class="link" data-act="go" data-to="achievements">${ready ? `<span class="pill">${ready} p/ resgatar</span>` : `Conquistas ${ic('chevR')}`}</button></div>
  <div class="card">${ch.map(challengeRow).join('')}</div>
