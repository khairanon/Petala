/* ---------- Relatórios ---------- */
function reportMonths() {
  const cur = D.thisMonth();
  const n = { '1m': 1, '3m': 3, '6m': 6, '12m': 12 }[UI.repPeriod];
  if (n) return Array.from({ length: n }, (_, i) => D.addMonths(cur, i - n + 1));
  const from = UI.repFrom || D.addMonths(cur, -5), to = UI.repTo || cur;
  const out = []; for (let m = from <= to ? from : to; m <= (from <= to ? to : from) && out.length < 36; m = D.addMonths(m, 1)) out.push(m);
  return out;
}
function moneyReports() {
  const months = reportMonths(), cat = UI.repCat;
  const sums = months.map(m => monthSummary(m, cat));
  const inc = sums.map(s => s.income), exp = sums.map(s => s.expense);
  const bal = months.map(m => totalBalance(D.dayOf(m, 31)));
  const byCat = {}; sums.forEach(s => Object.entries(s.byCat).forEach(([k, v]) => byCat[k] = (byCat[k] || 0) + v));
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([id, v]) => ({ label: finCat(id).name, value: v, color: finCat(id).color }));
  const tIn = sum(inc), tOut = sum(exp), saved = tIn - tOut;
  const top = cats[0];
  const first = months[0], last = months[months.length - 1];
  let hist = S.fin.tx.filter(t => t.date.slice(0, 7) >= first && t.date.slice(0, 7) <= last && (cat === 'all' || t.cat === cat) && (UI.txType === 'all' || t.type === UI.txType)).sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="scroll-x">${[['1m', 'Este mês'], ['3m', '3 meses'], ['6m', '6 meses'], ['12m', '12 meses'], ['custom', 'Personalizado']].map(([v, l]) => `<button class="fchip ${UI.repPeriod === v ? 'on' : ''}" data-act="repPeriod" data-v="${v}">${l}</button>`).join('')}</div>
  ${UI.repPeriod === 'custom' ? `<div class="inline-fields" style="margin:6px 0">${field('De', `<input type="month" value="${UI.repFrom || D.addMonths(D.thisMonth(), -5)}" data-change="repFrom">`)}${field('Até', `<input type="month" value="${UI.repTo || D.thisMonth()}" data-change="repTo">`)}</div>` : ''}
  <div class="field" style="margin:6px 0 12px"><select data-change="repCat"><option value="all">Todas as categorias</option>${S.fin.cats.map(c => `<option value="${c.id}" ${cat === c.id ? 'selected' : ''}>${c.kind === 'income' ? '↑' : '↓'} ${esc(c.name)}</option>`).join('')}</select></div>
  <div class="card econ-card">
    <div class="card-head"><h3>${ic('piggy')}Resumo de economia</h3><span class="muted small">${months.length === 1 ? D.monthLabel(first) : `${D.monthShort(first)} – ${D.monthShort(last)}`}</span></div>
    <div class="grid2"><div><p class="small muted">Entradas</p><b class="pos">${money(tIn)}</b></div><div><p class="small muted">Despesas</p><b>${money(tOut)}</b></div>
    <div><p class="small muted">${saved >= 0 ? 'Economizado' : 'Déficit'}</p><b class="${saved >= 0 ? 'pos' : 'neg'}">${money(saved)}</b></div><div><p class="small muted">Taxa de economia</p><b>${tIn ? pctTxt(saved / tIn) : '—'}</b></div>
    <div><p class="small muted">Gasto médio/mês</p><b>${money(Math.round(tOut / months.length))}</b></div><div><p class="small muted">Maior categoria</p><b>${top ? esc(top.label) : '—'}</b></div></div>
  </div>
  <div class="section-title"><h2>Receitas x despesas</h2></div>
  <div class="card">${barsChart(months.map(m => D.monthShort(m)), inc, exp)}</div>
  <div class="section-title"><h2>Despesas por categoria</h2></div>
  <div class="card">${donutChart(cats, 'no período')}</div>
  <div class="section-title"><h2>Evolução do saldo</h2></div>
  <div class="card">${lineChart(months.map(m => D.monthShort(m)), bal)}<p class="hint" style="margin-top:6px">Saldo total das contas no fim de cada mês.</p></div>
  <div class="section-title"><h2>Histórico</h2><span class="muted small">${hist.length} itens</span></div>
  <div class="scroll-x">${[['all', 'Tudo'], ['income', 'Entradas'], ['expense', 'Despesas'], ['transfer', 'Transferências']].map(([v, l]) => `<button class="fchip ${UI.txType === v ? 'on' : ''}" data-act="txType" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="card list">${hist.slice(0, 120).map(t => txItem(t, { showDate: true })).join('') || '<p class="free-day">Nada no período</p>'}</div>
  ${hist.length > 120 ? '<p class="hint" style="text-align:center;margin-top:8px">Mostrando os 120 mais recentes. Use os filtros para refinar.</p>' : ''}`;
}
ACT.repPeriod = el => { UI.repPeriod = el.dataset.v; render(); };
CHG.repCat = el => { UI.repCat = el.value; render(); };
CHG.repFrom = el => { UI.repFrom = el.value; render(); };
CHG.repTo = el => { UI.repTo = el.value; render(); };

</script>
<script>/* js/finance/fin-forms.js */
'use strict';
/* ============================================================
   Finanças · formulários (lançamentos, cartões, contas, metas)
   ============================================================ */
const accSelect = (name, sel) => `<select name="${name}">${S.fin.accounts.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.name)} · ${money(accountBalance(a.id))}</option>`).join('')}</select>`;
const cardSelect = (name, sel) => `<select name="${name}">${S.fin.cards.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)} · disp. ${money(cardAvailable(c))}</option>`).join('')}</select>`;
const finCatOpts = kind => finCats(kind).map(c => ({ value: c.id, label: c.name, color: c.color, icon: c.icon }));

ACT.moneyAdd = () => openMenu('Registrar', [
  { icon: 'down', label: 'Despesa', act: 'newExpense', color: '#DD6585' },
  { icon: 'up', label: 'Receita', act: 'newIncome', color: '#3D8F67' },
  { icon: 'card', label: 'Compra no cartão', act: 'newCardPurchase', color: '#5F69B8' },
  { icon: 'transfer', label: 'Transferência', act: 'newTransfer', color: '#8B67C9' },
  { icon: 'piggy', label: 'Guardar em meta', act: 'quickSave', color: '#C9578A' },
  { icon: 'bank', label: 'Nova conta', act: 'newAccount', color: '#5F69B8' },
]);

/* ---------- Receita / despesa ---------- */
function txForm(t = {}) {
  const isNew = !t.id;
  const type = t.type || 'expense', method = t.method || 'conta';
  const inst = t.inst;
  openSheet({
    title: isNew ? (type === 'income' ? 'Nova receita' : method === 'cartao' ? 'Compra no cartão' : 'Nova despesa') : 'Editar lançamento',
    html: `<form class="form tx-form">
      ${isNew ? segmented('type', [{ value: 'expense', label: 'Despesa' }, { value: 'income', label: 'Receita' }], type) : `<input type="hidden" name="type" value="${type}">`}
      <input class="input money-input" name="amount" inputmode="decimal" placeholder="R$ 0,00" value="${t.amount ? centsToInput(t.amount) : ''}" required autocomplete="off">
      ${inst ? `<p class="hint" style="text-align:center">Parcela ${inst.n} de ${inst.of} · compra total ${money(inst.total)}</p>` : ''}
      ${field('Descrição', `<input name="desc" maxlength="80" placeholder="Ex.: Mercado, Uber, Salário" value="${esc(t.desc || '')}">`)}
      ${field('Data', `<input type="date" name="date" required value="${t.date || D.today()}">`)}
      <div class="cats-expense" ${type === 'income' ? 'hidden' : ''}>${fieldset('Categoria', chipsRadio('cat_expense', finCatOpts('expense'), type === 'expense' ? (t.cat || 'fe_ali') : 'fe_ali', 'scroll'))}</div>
      <div class="cats-income" ${type === 'income' ? '' : 'hidden'}>${fieldset('Categoria', chipsRadio('cat_income', finCatOpts('income'), type === 'income' ? (t.cat || 'fi_sal') : 'fi_sal', 'scroll'))}</div>
      <div class="exp-only" ${type === 'income' ? 'hidden' : ''}>
        ${fieldset('Forma de pagamento', segmented('method', [{ value: 'conta', label: 'Conta / dinheiro' }, { value: 'cartao', label: 'Cartão de crédito' }], method))}
      </div>
      <div class="acc-block">${field(type === 'income' ? 'Entrou em' : 'Saiu de', accSelect('account', t.account || S.fin.accounts[0]?.id))}
        ${toggle('paid', isNew ? (t.date || D.today()) <= D.today() : t.paid, type === 'income' ? 'Já recebi' : 'Já paguei', 'Desmarque para deixar como pendente')}</div>
      <div class="card-block" hidden>${S.fin.cards.length ? `${field('Cartão', cardSelect('card', t.card || S.fin.cards[0].id))}
        ${isNew ? field('Parcelas', `<select name="inst">${Array.from({ length: 24 }, (_, i) => `<option value="${i + 1}">${i ? `${i + 1}x` : 'À vista (1x)'}</option>`).join('')}</select>`) : ''}
        <p class="hint">Vai para a fatura do cartão. O saldo da conta só muda quando você pagar a fatura.</p>` : `<div class="alert warn">${ic('info')}<span>Nenhum cartão cadastrado. <button type="button" class="link" data-act="newCard">Cadastrar cartão</button></span></div>`}</div>
      <div class="exp-only" ${type === 'income' ? 'hidden' : ''}>${fieldset('Tipo de despesa', segmented('fixed', [{ value: '0', label: 'Variável' }, { value: '1', label: 'Fixa' }], t.fixed ? '1' : '0'))}</div>
      ${isNew ? `<div class="rec-block">${toggle('recurring', false, 'Repetir todo mês', 'Cria automaticamente nos próximos meses')}</div>` : t.rec ? `<p class="hint">${ic('repeat')} Lançamento recorrente. Gerencie em Lançamentos → Fixas.</p>` : ''}
      ${field('Observação', `<input name="note" maxlength="140" placeholder="Opcional" value="${esc(t.note || '')}">`)}
      <div class="btn-row">${!isNew ? `<button type="button" class="btn danger" data-act="delTx" data-id="${t.id}">${ic('trash')}</button>` : ''}<button class="btn primary">${isNew ? 'Registrar' : 'Salvar'}</button></div>
      ${inst && !isNew ? `<button type="button" class="btn ghost block" data-act="delTxGroup" data-g="${inst.group}">Excluir todas as ${inst.of} parcelas</button>` : ''}
    </form>`,
    onMount: sh => {
      const f = sh.querySelector('form');
      const upd = () => {
        const ty = f.elements.type.value || type, m = (f.querySelector('[name=method]:checked') || {}).value || 'conta';
        const isExp = ty === 'expense';
        sh.querySelectorAll('.exp-only').forEach(x => x.hidden = !isExp);
        sh.querySelector('.cats-expense').hidden = !isExp; sh.querySelector('.cats-income').hidden = isExp;
        const card = isExp && m === 'cartao';
        sh.querySelector('.acc-block').hidden = card; sh.querySelector('.card-block').hidden = !card;
        const lbl = sh.querySelector('.acc-block .field-label'); if (lbl) lbl.textContent = isExp ? 'Saiu de' : 'Entrou em';
        const pl = sh.querySelector('.acc-block .toggle-row b'); if (pl) pl.textContent = isExp ? 'Já paguei' : 'Já recebi';
        const instSel = f.querySelector('[name=inst]'), rec = sh.querySelector('.rec-block');
        if (rec) rec.hidden = !!(card && instSel && +instSel.value > 1);
        sh.querySelector('.sheet-head h3').textContent = isNew ? (isExp ? (card ? 'Compra no cartão' : 'Nova despesa') : 'Nova receita') : 'Editar lançamento';
      };
      f.addEventListener('change', upd); upd();
      const date = f.querySelector('[name=date]'), paid = f.querySelector('[name=paid]');
      if (isNew) date.addEventListener('change', () => { paid.checked = date.value <= D.today(); });
      if (isNew) setTimeout(() => f.elements.amount.focus(), 350);
    },
    onSubmit: fd => {
      const type = fd.get('type');
      const amount = parseMoney(fd.get('amount'));
      if (amount <= 0) { toast('Informe um valor maior que zero', 'alert'); return false; }
      const method = type === 'expense' ? (fd.get('method') || 'conta') : 'conta';
      if (method === 'cartao' && !S.fin.cards.length) { toast('Cadastre um cartão primeiro', 'card'); return false; }
      const data = {
        type, amount, desc: fd.get('desc').trim(), date: fd.get('date'), cat: fd.get(type === 'income' ? 'cat_income' : 'cat_expense'),
        method, account: method === 'conta' ? fd.get('account') : null, card: method === 'cartao' ? fd.get('card') : null,
        paid: method === 'cartao' ? true : !!fd.get('paid'), fixed: type === 'expense' && fd.get('fixed') === '1', note: fd.get('note').trim(),
      };
      if (!data.desc) data.desc = finCat(data.cat).name;
      if (isNew) {
        let first;
        if (method === 'cartao') { const n = +fd.get('inst') || 1; first = addCardPurchase(data, n)[0]; }
        else first = addTx(data);
        if (fd.get('recurring') && !(method === 'cartao' && (+fd.get('inst') || 1) > 1)) {
          const r = { id: uid(), type, desc: data.desc, amount, day: +data.date.slice(8), cat: data.cat, method, account: data.account, card: data.card, start: D.month(data.date), active: true, done: { [D.month(data.date)]: first.id } };
          S.fin.recurrences.push(r); first.rec = r.id; first.fixed = true;
        }
        const gotXP = !!S.game.awards['tx:' + first.id];
        toast(`${type === 'income' ? 'Entrada registrada' : 'Despesa registrada'}${gotXP ? ` · +${XP.tx} XP pelo controle` : ''}`, type === 'income' ? 'up' : 'check');
      } else {
        const cur = S.fin.tx.find(x => x.id === t.id);
        const cardChanged = cur.card !== data.card || cur.date !== data.date;
        Object.assign(cur, data);
        if (method === 'cartao' && (!cur.inst || cardChanged)) cur.invoice = invoiceFor(cardById(cur.card), cur.date);
        if (method !== 'cartao') { cur.invoice = null; }
        toast('Lançamento atualizado', 'check');
      }
      refresh();
    }
  });
}
ACT.newExpense = () => txForm({ type: 'expense', date: UI.moneyMonth && UI.moneyMonth !== D.thisMonth() ? D.dayOf(UI.moneyMonth, 1) : D.today() });
ACT.newIncome = () => txForm({ type: 'income', date: UI.moneyMonth && UI.moneyMonth !== D.thisMonth() ? D.dayOf(UI.moneyMonth, 1) : D.today() });
ACT.newCardPurchase = el => {
  if (!S.fin.cards.length) { toast('Cadastre seu cartão primeiro ♡', 'card'); return cardForm(); }
  txForm({ type: 'expense', method: 'cartao', card: el && el.dataset && el.dataset.card });
};
ACT.editTx = el => txForm(S.fin.tx.find(t => t.id === el.dataset.id));
ACT.delTx = async el => {
  const t = S.fin.tx.find(x => x.id === el.dataset.id);
  if (!await ask(`${esc(t.desc)} · ${money(t.amount)}${t.inst ? ` (só a parcela ${t.inst.n}/${t.inst.of})` : ''}`, { ok: 'Excluir', danger: true, title: 'Excluir lançamento?' })) return;
  deleteTx(t.id); closeSheet(); refresh(); toast('Lançamento excluído', 'trash');
};
ACT.delTxGroup = async el => {
  const g = el.dataset.g, arr = S.fin.tx.filter(t => t.inst && t.inst.group === g);
  if (!await ask(`Serão excluídas ${arr.length} parcelas desta compra.`, { ok: 'Excluir todas', danger: true, title: 'Excluir compra parcelada?' })) return;
  arr.forEach(t => deleteTx(t.id)); closeSheet(); refresh(); toast('Compra excluída', 'trash');
};

/* ---------- Transferência entre contas ---------- */
function transferForm(t = {}) {
  if (S.fin.accounts.length < 2) { toast('Crie pelo menos 2 contas para transferir', 'bank'); return accountForm(); }
  const isNew = !t.id;
  openSheet({
    title: isNew ? 'Transferir' : 'Editar transferência',
    html: `<form class="form">
      <input class="input money-input" name="amount" inputmode="decimal" placeholder="R$ 0,00" required value="${t.amount ? centsToInput(t.amount) : ''}">
      ${field('De', accSelect('from', t.account || S.fin.accounts[0].id))}
      ${field('Para', accSelect('to', t.toAccount || S.fin.accounts[1].id))}
      ${field('Data', `<input type="date" name="date" value="${t.date || D.today()}">`)}
      ${field('Descrição', `<input name="desc" maxlength="60" placeholder="Ex.: Saque, Pix para poupança" value="${esc(t.desc || '')}">`)}
      <p class="hint">Transferências mudam o saldo de cada conta, mas não contam como receita nem despesa.</p>
      <div class="btn-row">${!isNew ? `<button type="button" class="btn danger" data-act="delTransfer" data-id="${t.id}">${ic('trash')}</button>` : ''}<button class="btn primary">${isNew ? 'Transferir' : 'Salvar'}</button></div>
    </form>`,
    onSubmit: fd => {
      const amount = parseMoney(fd.get('amount'));
      if (amount <= 0) { toast('Informe o valor', 'alert'); return false; }
      if (fd.get('from') === fd.get('to')) { toast('Escolha contas diferentes', 'alert'); return false; }
      const data = { type: 'transfer', amount, account: fd.get('from'), toAccount: fd.get('to'), date: fd.get('date'), desc: fd.get('desc').trim() || 'Transferência', paid: true, cat: null, method: 'conta' };
      if (isNew) addTx(data); else Object.assign(S.fin.tx.find(x => x.id === t.id), data);
      toast('Transferência registrada', 'transfer'); refresh();
    }
  });
}
ACT.newTransfer = () => transferForm();
ACT.editTransfer = el => transferForm(S.fin.tx.find(t => t.id === el.dataset.id));
ACT.delTransfer = async el => { if (!await ask('A transferência será desfeita.', { ok: 'Excluir', danger: true, title: 'Excluir transferência?' })) return; deleteTx(el.dataset.id); closeSheet(); refresh(); };

/* ---------- Cartões ---------- */
function cardForm(c = {}) {
  const isNew = !c.id;
  const used = c.id ? cardUsed(c) : 0;
  openSheet({
    title: isNew ? 'Novo cartão' : 'Editar cartão',
    html: `<form class="form">
      ${field('Nome do cartão', `<input name="name" required maxlength="30" placeholder="Ex.: Nubank, Inter" value="${esc(c.name || '')}">`)}
      ${field('Limite total', `<input name="limit" inputmode="decimal" required placeholder="R$ 0,00" value="${centsToInput(c.limit)}">`)}
      ${isNew ? field('Limite disponível hoje (opcional)', `<input name="avail" inputmode="decimal" placeholder="Igual ao limite total">`) + '<p class="hint">Se já tem compras de antes, informe o disponível que aparece no app do banco. A diferença vira um "saldo anterior" na fatura atual.</p>' : `<p class="hint">Em uso agora: ${money(used)} · disponível ${money((c.limit || 0) - used)}</p>`}
      <div class="inline-fields">${field('Dia do fechamento', `<input name="closeDay" type="number" min="1" max="31" required value="${c.closeDay || ''}" placeholder="Ex.: 3">`)}${field('Dia do vencimento', `<input name="dueDay" type="number" min="1" max="31" required value="${c.dueDay || ''}" placeholder="Ex.: 10">`)}</div>
      ${fieldset('Cor', colorPicker('color', c.color || '#C7B5EE'))}
      <div class="btn-row"><button class="btn primary">${isNew ? 'Adicionar cartão' : 'Salvar'}</button></div>
    </form>`,
    onSubmit: fd => {
      const data = { name: fd.get('name').trim(), limit: parseMoney(fd.get('limit')), closeDay: clamp(+fd.get('closeDay'), 1, 31), dueDay: clamp(+fd.get('dueDay'), 1, 31), color: fd.get('color') };
      if (!data.name || data.limit <= 0) { toast('Informe nome e limite', 'alert'); return false; }
      if (isNew) {
        const card = { id: 'k_' + uid(), ...data }; S.fin.cards.push(card);
        const availStr = fd.get('avail');
        if (availStr && availStr.trim()) {
          const prev = data.limit - parseMoney(availStr);
          if (prev > 0) addTx({ type: 'expense', amount: prev, desc: 'Saldo anterior do cartão', date: D.today(), cat: 'fe_out', method: 'cartao', card: card.id, note: 'Valor já usado antes de começar a usar o app' }, { xp: false });
        }
        toast('Cartão adicionado', 'card');
      } else Object.assign(cardById(c.id), data);
      refresh();
    }
  });
}
ACT.newCard = () => cardForm();
ACT.editCard = el => cardForm(cardById(el.dataset.id));
ACT.delCard = async el => {
  const c = cardById(el.dataset.id);
  const n = S.fin.tx.filter(t => t.card === c.id).length;
  if (!await ask(n ? `Este cartão tem ${n} compras e ${S.fin.payments.filter(p => p.card === c.id).length} pagamentos registrados. Tudo será excluído.` : 'O cartão será removido.', { ok: 'Excluir', danger: true, title: `Excluir ${esc(c.name)}?` })) return;
  S.fin.tx.filter(t => t.card === c.id).forEach(t => deleteTx(t.id));
  S.fin.payments = S.fin.payments.filter(p => p.card !== c.id);
  S.fin.recurrences = S.fin.recurrences.filter(r => r.card !== c.id || r.method !== 'cartao');
  S.fin.cards = S.fin.cards.filter(x => x.id !== c.id);
  closeSheet(); refresh();
};
ACT.payInvoice = el => {
  const c = cardById(el.dataset.c), mk = el.dataset.m;
  const rest = Math.max(0, invoiceTotal(c, mk) - invoicePaid(c, mk));
  openSheet({
    title: 'Pagar fatura',
    html: `<form class="form">
      <p class="muted small" style="text-align:center">${esc(c.name)} · vence ${D.shortY(invoiceDates(c, mk).due)}</p>
      <input class="input money-input" name="amount" inputmode="decimal" required value="${centsToInput(rest)}">
      ${field('Pago com', accSelect('account', S.fin.accounts[0]?.id))}
      ${field('Data do pagamento', `<input type="date" name="date" value="${D.today()}">`)}
      <p class="hint">O valor sai do saldo da conta escolhida e libera o limite do cartão. As compras já foram contadas como despesa, então o pagamento não entra de novo nos gastos.</p>
      <div class="btn-row"><button class="btn primary">Confirmar pagamento</button></div>
    </form>`,
    onSubmit: fd => {
      const amount = parseMoney(fd.get('amount'));
      if (amount <= 0) return false;
      S.fin.payments.push({ id: uid(), card: c.id, invoice: mk, amount, date: fd.get('date'), account: fd.get('account') });
      award('pay:' + c.id + ':' + mk, 10, 'Fatura paga', { silent: true });
      toast('Pagamento registrado ✓', 'check'); refresh();
    }
  });
};

/* ---------- Contas ---------- */
function accountForm(a = {}) {
  const isNew = !a.id;
  openSheet({
    title: isNew ? 'Nova conta' : 'Editar conta',
    html: `<form class="form">
      ${!isNew ? `<div class="invoice-head" style="--c:${a.color}"><p class="small">Saldo atual</p><b>${money(accountBalance(a.id))}</b></div>` : ''}
      ${field('Nome', `<input name="name" required maxlength="30" placeholder="Ex.: Nubank, Carteira, Poupança" value="${esc(a.name || '')}">`)}
      ${fieldset('Tipo', chipsRadio('type', Object.entries(ACC_TYPES).map(([k, v]) => ({ value: k, label: v.label, icon: v.icon })), a.type || 'banco'))}
      ${field('Saldo inicial', `<input name="initial" inputmode="decimal" placeholder="R$ 0,00" value="${centsToInput(a.initial)}">`)}
      <p class="hint">O saldo inicial é o valor que havia na conta quando você começou a usar o app. O resto é calculado pelos lançamentos.</p>
      ${fieldset('Cor', colorPicker('color', a.color || '#C7B5EE'))}
      <div class="btn-row">${!isNew && S.fin.accounts.length > 1 ? `<button type="button" class="btn danger" data-act="delAccount" data-id="${a.id}">${ic('trash')}</button>` : ''}<button class="btn primary">Salvar</button></div>
    </form>`,
    onSubmit: fd => {
      const raw = fd.get('initial').trim();
      const neg = raw.startsWith('-');
      const data = { name: fd.get('name').trim(), type: fd.get('type'), initial: parseMoney(raw.replace('-', '')) * (neg ? -1 : 1), color: fd.get('color') };
      if (!data.name) return false;
      if (isNew) S.fin.accounts.push({ id: 'a_' + uid(), ...data }); else Object.assign(accById(a.id), data);
      toast('Conta salva', 'bank'); refresh();
    }
  });
}
ACT.newAccount = () => accountForm();
ACT.editAccount = el => accountForm(accById(el.dataset.id));
ACT.delAccount = async el => {
  const a = accById(el.dataset.id);
  const used = S.fin.tx.some(t => t.account === a.id || t.toAccount === a.id) || S.fin.payments.some(p => p.account === a.id) || S.fin.savings.some(g => g.moves.some(m => m.account === a.id));
  if (used) return toast('Essa conta tem lançamentos. Exclua ou mova-os antes.', 'info');
  if (!await ask('A conta será removida.', { ok: 'Excluir', danger: true, title: `Excluir ${esc(a.name)}?` })) return;
  S.fin.accounts = S.fin.accounts.filter(x => x.id !== a.id); closeSheet(); refresh();
};

/* ---------- Orçamento ---------- */
ACT.editLimit = () => openSheet({
  title: 'Limite mensal',
  html: `<form class="form"><p class="muted small">Quanto você quer gastar, no máximo, por mês? Vale para todos os meses e pode mudar quando quiser.</p>
    <input class="input money-input" name="limit" inputmode="decimal" placeholder="R$ 0,00" value="${centsToInput(S.fin.monthlyLimit)}">
    <p class="hint">Dica: some suas entradas fixas e tire o que quer guardar.</p>
    <div class="btn-row">${S.fin.monthlyLimit ? '<button type="button" class="btn ghost" data-act="clearLimit">Remover</button>' : ''}<button class="btn primary">Salvar</button></div></form>`,
  onSubmit: fd => { S.fin.monthlyLimit = parseMoney(fd.get('limit')); toast('Orçamento definido', 'target'); refresh(); }
});
ACT.clearLimit = () => { S.fin.monthlyLimit = 0; closeSheet(); refresh(); };
ACT.editCatBudget = el => {
  const c = S.fin.cats.find(x => x.id === el.dataset.id);
  openSheet({
    title: `Orçamento · ${esc(c.name)}`,
    html: `<form class="form"><input class="input money-input" name="b" inputmode="decimal" placeholder="R$ 0,00" value="${centsToInput(c.budget)}">
      <p class="hint">Gasto neste mês: ${money(catSpent(UI.moneyMonth || D.thisMonth(), c.id))}. Deixe vazio para não usar orçamento nesta categoria.</p>
      <div class="btn-row"><button class="btn primary">Salvar</button></div></form>`,
    onSubmit: fd => { c.budget = parseMoney(fd.get('b')); refresh(); }
  });
};

/* ---------- Recorrências ---------- */
function recurrencesSheet() {
  const rs = S.fin.recurrences;
  openSheet({
    title: 'Receitas e despesas fixas',
    html: `<p class="small muted" style="margin-bottom:10px">Lançamentos que se repetem todo mês são criados automaticamente como pendentes. Pause ou remova quando quiser; os meses já lançados continuam no histórico.</p>
    <div class="card flat list">${rs.length ? rs.map(r => { const c = finCat(r.cat); return `<div class="item">${catDot(c)}<div class="body"><div class="title">${esc(r.desc)}</div><div class="meta"><span>todo dia ${r.day}</span><span>${r.type === 'income' ? 'Receita' : r.method === 'cartao' ? 'Cartão' : 'Despesa'}</span>${r.active ? '' : '<span class="pill gray" style="height:20px;font-size:11px">Pausada</span>'}</div></div>
      <div class="amount ${r.type === 'income' ? 'in' : ''}">${money(r.amount)}</div>
      <button type="button" class="icon-btn sm soft" data-act="recToggle" data-id="${r.id}" aria-label="Pausar">${ic(r.active ? 'clock' : 'repeat')}</button>
      <button type="button" class="icon-btn sm soft" data-act="recEdit" data-id="${r.id}" aria-label="Editar">${ic('edit')}</button>
      <button type="button" class="icon-btn sm soft" data-act="recDel" data-id="${r.id}" aria-label="Remover">${ic('trash')}</button></div>`; }).join('') : '<p class="free-day">Nenhuma recorrência. Ao registrar algo, ative "Repetir todo mês".</p>'}</div>`
  });
}
ACT.recurrences = () => recurrencesSheet();
ACT.recToggle = el => { const r = S.fin.recurrences.find(x => x.id === el.dataset.id); r.active = !r.active; if (r.active) runRecurrences(); refresh(); recurrencesSheet(); };
ACT.recDel = async el => {
  if (!await ask('Os próximos meses não serão mais criados. O que já foi lançado continua.', { ok: 'Remover', danger: true, title: 'Remover recorrência?' })) return;
  S.fin.recurrences = S.fin.recurrences.filter(x => x.id !== el.dataset.id);
  S.fin.tx.forEach(t => { if (t.rec === el.dataset.id) t.rec = null; });
  refresh(); recurrencesSheet();
};
ACT.recEdit = el => {
  const r = S.fin.recurrences.find(x => x.id === el.dataset.id);
  openSheet({
    title: 'Editar recorrência',
    html: `<form class="form"><input class="input money-input" name="amount" inputmode="decimal" value="${centsToInput(r.amount)}">
      ${field('Descrição', `<input name="desc" value="${esc(r.desc)}">`)}
      ${field('Dia do mês', `<input name="day" type="number" min="1" max="31" value="${r.day}">`)}
      <p class="hint">Vale para os próximos meses. Lançamentos já criados não mudam.</p>
      <div class="btn-row"><button class="btn primary">Salvar</button></div></form>`,
    onSubmit: fd => { r.amount = parseMoney(fd.get('amount')) || r.amount; r.desc = fd.get('desc').trim() || r.desc; r.day = clamp(+fd.get('day') || r.day, 1, 31); refresh(); setTimeout(recurrencesSheet, 300); }
  });
};

/* ---------- Metas de economia ---------- */
const SAVING_TEMPLATES = [
  { name: 'Reserva de emergência', icon: 'heart', color: '#B8E0C8' }, { name: 'Viagem', icon: 'plane', color: '#A8D8E8' },
  { name: 'Compras', icon: 'bag', color: '#F5B4CC' }, { name: 'Estudos', icon: 'grad', color: '#C7B5EE' }, { name: 'Docico', icon: 'cupcake', color: '#F7C6A3' },
];
function savingForm(g = {}) {
  const isNew = !g.id;
  openSheet({
    title: isNew ? 'Nova meta de economia' : 'Editar meta',
    html: `<form class="form">
      ${isNew ? `<div class="chips">${SAVING_TEMPLATES.map((t, i) => `<button type="button" class="fchip" data-tpl="${i}">${ic(t.icon)}${t.name}</button>`).join('')}</div>` : ''}
      ${field('Objetivo', `<input name="name" required maxlength="40" placeholder="Ex.: Reserva de emergência" value="${esc(g.name || '')}">`)}
      ${field('Valor desejado', `<input name="target" inputmode="decimal" required placeholder="R$ 0,00" value="${centsToInput(g.target)}">`)}
      ${field('Prazo', `<input type="date" name="deadline" value="${g.deadline || ''}">`)}
      ${fieldset('Ícone', iconPicker('icon', g.icon || 'piggy'))}
      ${fieldset('Cor', colorPicker('color', g.color || '#B8E0C8'))}
      <div class="btn-row"><button class="btn primary">${isNew ? 'Criar meta' : 'Salvar'}</button></div>
    </form>`,
    onMount: sh => sh.querySelectorAll('[data-tpl]').forEach(b => b.addEventListener('click', () => {
      const t = SAVING_TEMPLATES[+b.dataset.tpl], f = sh.querySelector('form');
      f.elements.name.value = t.name;
      const icn = f.querySelector(`[name=icon][value="${t.icon}"]`); if (icn) icn.checked = true;
      const col = f.querySelector(`[name=color][value="${t.color}"]`); if (col) col.checked = true;
      sh.querySelectorAll('[data-tpl]').forEach(x => x.classList.toggle('on', x === b));
    })),
    onSubmit: fd => {
      const data = { name: fd.get('name').trim(), target: parseMoney(fd.get('target')), deadline: fd.get('deadline') || null, icon: fd.get('icon'), color: fd.get('color') };
      if (!data.name || data.target <= 0) { toast('Informe objetivo e valor', 'alert'); return false; }
      if (isNew) S.fin.savings.push({ id: uid(), createdAt: D.today(), moves: [], ...data }); else Object.assign(S.fin.savings.find(x => x.id === g.id), data);
      toast('Meta de economia salva', 'piggy'); refresh();
    }
  });
}
ACT.newSaving = () => savingForm();
ACT.editSaving = el => savingForm(S.fin.savings.find(g => g.id === el.dataset.id));
ACT.quickSave = () => { if (!S.fin.savings.length) return savingForm(); if (S.fin.savings.length === 1) return savingMove(S.fin.savings[0].id, 1); UI.moneyTab = 'metas'; closeSheet(); go('money'); render(); };
function savingDetail(id) {
  const g = S.fin.savings.find(x => x.id === id); if (!g) return;
  const v = savingTotal(g), p = pct(v, g.target), need = savingMonthlyNeed(g);
  openSheet({
    title: esc(g.name), tall: true,
    html: `<div class="row" style="gap:16px">${ring(p, 90, 9, pctTxt(Math.min(1, p)))}<div><b class="big-money">${money(v)}</b><p class="small muted">de ${money(g.target)}${g.deadline ? ` · até ${D.shortY(g.deadline)}` : ''}</p>
      ${p >= 1 ? '<span class="pill ok" style="margin-top:6px">Meta alcançada! 🎉</span>' : need ? `<p class="small" style="margin-top:6px">Guarde <b>${money(need)}</b> por mês para chegar lá</p>` : `<p class="small" style="margin-top:6px">Faltam <b>${money(g.target - v)}</b></p>`}</div></div>
    <div class="btn-row"><button type="button" class="btn ghost" data-act="savingMove" data-id="${g.id}" data-s="-1">${ic('down')} Retirar</button><button type="button" class="btn primary" data-act="savingMove" data-id="${g.id}" data-s="1">${ic('up')} Depositar</button></div>
    <div class="section-title"><h2>Movimentações</h2></div>
    <div class="card flat list">${g.moves.length ? g.moves.slice().sort((a, b) => b.date.localeCompare(a.date)).map(m => `<div class="item"><span class="cat-ic" style="--c:${m.amount > 0 ? '#B8E0C8' : '#F5B4CC'};--ci:${shade(m.amount > 0 ? '#B8E0C8' : '#F5B4CC', .5)}">${ic(m.amount > 0 ? 'up' : 'down')}</span><div class="body"><div class="title">${m.amount > 0 ? 'Depósito' : 'Retirada'}</div><div class="meta">${D.shortY(m.date)}${m.account ? ' · ' + esc(accById(m.account)?.name || '') : ''}</div></div><div class="amount ${m.amount > 0 ? 'in' : ''}">${m.amount > 0 ? '+' : '−'}${money(Math.abs(m.amount))}</div><button type="button" class="icon-btn sm soft" data-act="delSavingMove" data-g="${g.id}" data-id="${m.id}" aria-label="Excluir">${ic('x')}</button></div>`).join('') : '<p class="free-day">Nenhum depósito ainda</p>'}</div>
    <div class="btn-row"><button type="button" class="btn danger" data-act="delSaving" data-id="${g.id}">${ic('trash')}</button><button type="button" class="btn soft" data-act="editSaving" data-id="${g.id}">${ic('edit')} Editar</button></div>`
  });
}
ACT.savingDetail = el => savingDetail(el.dataset.id);
function savingMove(id, sign) {
  const g = S.fin.savings.find(x => x.id === id);
  openSheet({
    title: sign > 0 ? `Depositar em ${esc(g.name)}` : `Retirar de ${esc(g.name)}`,
    html: `<form class="form"><input class="input money-input" name="amount" inputmode="decimal" placeholder="R$ 0,00" required>
      ${field(sign > 0 ? 'O dinheiro sai de' : 'O dinheiro volta para', `<select name="account"><option value="">Não mexer no saldo das contas</option>${S.fin.accounts.map(a => `<option value="${a.id}" ${a.id === S.fin.accounts[0].id ? 'selected' : ''}>${esc(a.name)} · ${money(accountBalance(a.id))}</option>`).join('')}</select>`)}
      ${field('Data', `<input type="date" name="date" value="${D.today()}">`)}
      <p class="hint">Escolha uma conta para o valor sair (ou voltar) do saldo dela, como uma "caixinha".</p>
      <div class="btn-row"><button class="btn primary">${sign > 0 ? 'Depositar' : 'Retirar'}</button></div></form>`,
    onMount: sh => setTimeout(() => sh.querySelector('[name=amount]').focus(), 350),
    onSubmit: fd => {
      const amt = parseMoney(fd.get('amount'));
      if (amt <= 0) return false;
      if (sign < 0 && amt > savingTotal(g)) { toast('Valor maior que o guardado', 'alert'); return false; }
      const m = { id: uid(), date: fd.get('date'), amount: amt * sign, account: fd.get('account') || null };
      g.moves.push(m);
      if (sign > 0) {
        if (awardsToday('sv:') < 3) award('sv:' + m.id, XP.saving, 'Depósito: ' + g.name);
        burst();
        if (g.target && savingTotal(g) >= g.target && savingTotal(g) - amt < g.target) setTimeout(() => celebrate({ title: 'Meta de economia alcançada!', text: `Você juntou ${money(g.target)} para "${esc(g.name)}". Que orgulho!`, icon: 'piggy' }), 400);
        else toast(pick(['Cada real guardado conta ✨', 'Seu futuro agradece ♡', 'Cofrinho mais feliz!']), 'piggy');
      } else toast('Retirada registrada', 'down');
      refresh(); setTimeout(() => savingDetail(g.id), 320);
    }
  });
}
ACT.savingMove = el => savingMove(el.dataset.id, +el.dataset.s);
ACT.delSavingMove = el => { const g = S.fin.savings.find(x => x.id === el.dataset.g); revoke('sv:' + el.dataset.id); g.moves = g.moves.filter(m => m.id !== el.dataset.id); refresh(); savingDetail(g.id); };
ACT.delSaving = async el => {
  const g = S.fin.savings.find(x => x.id === el.dataset.id);
  if (!await ask(savingTotal(g) ? `Os depósitos feitos a partir de contas voltam para o saldo delas.` : 'A meta será removida.', { ok: 'Excluir', danger: true, title: `Excluir "${esc(g.name)}"?` })) return;
  g.moves.forEach(m => revoke('sv:' + m.id));
  S.fin.savings = S.fin.savings.filter(x => x.id !== g.id); closeSheet(); refresh();
};

</script>
<script>/* js/app.js */
'use strict';
/* ============================================================
   Inicialização, lembretes e service worker
   ============================================================ */
function buildShell() {
  const tabs = [['home', 'home', 'Início'], ['agenda', 'calendar', 'Agenda'], ['tasks', 'tasks', 'Tarefas'], ['habits', 'habits', 'Hábitos'], ['profile', 'user', 'Perfil']];
  $('#tabbar').innerHTML = `<div class="tabbar-in">${tabs.map(([r, i, l]) => `<button data-tab="${r}" data-act="go" data-to="${r}">${ic(i)}<span>${l}</span></button>`).join('')}</div>`;
  $('#fab').innerHTML = ic('plus');
}

/* ---------- Notificações / lembretes ---------- */
async function enableNotifications() {
  if (!('Notification' in window)) return false;
  try { return (await Notification.requestPermission()) === 'granted'; } catch (e) { return false; }
}
const canNotify = () => S.settings.notifications && 'Notification' in window && Notification.permission === 'granted';
async function notify(title, body, tag) {
  if (!canNotify()) { toast(`<b>${esc(title)}</b> · ${esc(body)}`, 'bell'); return; }
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.showNotification(title, { body, tag, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png' });
    else new Notification(title, { body, tag });
  } catch (e) { toast(`<b>${esc(title)}</b> · ${esc(body)}`, 'bell'); }
}
function reminderTick() {
  if (!S) return;
  const now = new Date(), t = D.today(), nowMin = now.getHours() * 60 + now.getMinutes();
  let changed = false;
  for (const e of [...eventsOn(t), ...eventsOn(D.add(t, 1))]) {
    if (e.done || e.reminder == null || e.reminder < 0) continue;
    const startMin = e.allDay || !e.start ? 8 * 60 : toMin(e.start);
    const fire = D.parse(e.date); fire.setHours(0, 0, 0, 0); fire.setMinutes(startMin - (e.allDay || !e.start ? 0 : e.reminder));
    const key = `ev:${e.id}:${e.date}:${e.start}:${e.reminder}`;
    if (S.notified[key]) continue;
    const diff = now - fire;
    if (diff >= 0 && diff < 90 * 60000) { notify(e.title, e.allDay || !e.start ? 'Hoje' : `${e.start}${e.reminder ? ` · em ${e.reminder >= 60 ? e.reminder / 60 + 'h' : e.reminder + ' min'}` : ' · agora'}`, key); S.notified[key] = t; changed = true; }
  }
  const hr = toMin(S.settings.habitReminder);
  if (hr != null && S.habits.length && !S.notified['hab:' + t] && nowMin >= hr && nowMin - hr < 180) {
    const pend = habitsDueOn(t).filter(h => !h.log[t]);
    if (pend.length) notify('Hora dos seus hábitos ✿', `Faltam ${pend.length}: ${pend.slice(0, 3).map(h => h.name).join(', ')}${pend.length > 3 ? '…' : ''}`, 'hab');
    S.notified['hab:' + t] = t; changed = true;
  }
  if (!S.notified['bill:' + t] && nowMin >= 9 * 60) {
    const bills = S.fin.tx.filter(x => x.type === 'expense' && x.method === 'conta' && !x.paid && x.date <= t);
    if (bills.length) notify('Contas para pagar', `${plural(bills.length, 'conta pendente', 'contas pendentes')} · ${money(sum(bills, b => b.amount), { force: true })}`, 'bill');
    S.notified['bill:' + t] = t; changed = true;
  }
  if (changed) { // limpa registros antigos
    const old = D.add(t, -40);
    for (const k in S.notified) if (S.notified[k] < old) delete S.notified[k];
    save();
  }
}

/* ---------- Atualizações do app ---------- */
const APP_VERSION = '1.3', APP_BUILD = '20261126165034';
let updateShown = false;
async function checkUpdate(manual = false) {
  if (!/^https?:$/.test(location.protocol) || !navigator.onLine) { if (manual) toast('Conecte-se à internet para procurar atualizações', 'info'); return; }
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const v = await r.json();
    if (v.build && v.build !== APP_BUILD) showUpdateBar(v.version);
    else if (manual) toast(`Você já está na versão mais recente (v${APP_VERSION})`, 'check');
  } catch (e) { if (manual) toast('Não foi possível verificar agora', 'info'); }
}
function showUpdateBar(ver) {
  if (updateShown) return; updateShown = true;
  const bar = document.createElement('div');
  bar.className = 'update-bar';
  bar.innerHTML = `${ic('sparkle')}<span>Nova versão${ver ? ' v' + esc(ver) : ''} disponível</span><button class="btn primary sm" data-act="applyUpdate">Atualizar</button>`;
  document.body.appendChild(bar);
  requestAnimationFrame(() => bar.classList.add('show'));
}
ACT.applyUpdate = async () => {
  saveNow(); // os dados ficam salvos no aparelho; só o app é trocado
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) { await reg.update(); if (reg.waiting) reg.waiting.postMessage('skipWaiting'); }
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) { }
  location.reload();
};
ACT.checkUpdate = () => checkUpdate(true);

let lastDay = null;
function onResume() {
  if (D.today() !== lastDay) { lastDay = D.today(); runRecurrences(); if (UI.habitDate && UI.habitDate < D.today()) UI.habitDate = D.today(); render(); }
  reminderTick();
  checkUpdate();
}

function init() {
  loadState();
  applySeeds();
  installDecorTextures();
  buildShell();
  applyAccent();
  lastDay = D.today();
  runRecurrences();
  window.addEventListener('hashchange', () => render(true));
  render(true);
  checkAchievements();
  if (!S.profile.onboarded) setTimeout(showOnboarding, 450);
  if (!STORAGE_OK) setTimeout(() => toast('Armazenamento bloqueado neste modo. Instale o app para salvar seus dados.', 'alert'), 1200);
  requestPersistence();
  setTimeout(reminderTick, 2500);
  setTimeout(() => checkUpdate(), 3000);
  setInterval(reminderTick, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') onResume(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* indisponível (ex.: pré-visualização) */ });
  }
}
document.addEventListener('DOMContentLoaded', init);

</script>
